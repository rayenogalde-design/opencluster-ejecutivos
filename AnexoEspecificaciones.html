<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anexo de especificaciones técnicas · OpenCluster</title>
<script src="EspecificacionesSala.js"></script>
<style>
:root{
  --navy:#001A60; --navy2:#12306e; --celeste:#06B3FD; --gris:#64748B;
  --linea:#E2E8F0; --papel:#fff; --fondo:#F4F7FB; --tinta:#1F2937;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- barra de herramientas, no se imprime ---------- */
.barra{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.barra h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
.barra .sep{flex:1}
.barra button,.barra label{font:inherit;font-size:13px}
.btn{background:var(--celeste);color:#00214d;border:0;border-radius:7px;
  padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:#cfe6ff;border:1px solid #3c5da0}
.aviso{background:#FFF6E0;color:#92400E;padding:11px 22px;font-size:13.5px;border-bottom:1px solid #f0dcae}

/* ---------- hoja ---------- */
.hoja{max-width:940px;margin:26px auto 60px;background:var(--papel);
  box-shadow:0 4px 24px rgba(16,32,66,.10);border-radius:4px;overflow:hidden}
.franja{height:7px;background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 45%,var(--celeste) 100%)}

.portada{padding:44px 54px 34px}
.portada img{height:52px;margin-bottom:26px}
.portada .rot{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--celeste);font-weight:700}
.portada h2{font-size:31px;line-height:1.18;margin:8px 0 14px;color:var(--navy);font-weight:700;letter-spacing:-.4px}
.portada p{margin:0;color:var(--gris);max-width:62ch;font-size:14.5px}
.meta{margin-top:26px;display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid var(--linea);padding-top:18px}
.meta div{font-size:13px}
.meta b{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gris);font-weight:700;margin-bottom:3px}

/* ---------- ficha de producto ---------- */
.ficha{padding:32px 54px;border-top:1px solid var(--linea);break-inside:avoid;page-break-inside:avoid}
.ficha:nth-child(even){background:#FCFDFF}
.cab{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.num{width:31px;height:31px;flex:none;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.cab h3{margin:0;font-size:20.5px;color:var(--navy);font-weight:700;letter-spacing:-.2px}
.cod{font-size:11.5px;color:var(--gris);background:#EFF6FD;border:1px solid #dae8f7;
  padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.intro{margin:10px 0 20px;font-size:15px;color:#22314d;max-width:78ch}

.bloques{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px}
.bloque{break-inside:avoid}
.bloque.ancho{grid-column:1/-1}
.bloque h4{margin:0 0 7px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--celeste);font-weight:800}
.bloque p{margin:0;font-size:13.6px;color:#33415c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#F1F6FC;border:1px solid #e0eaf6;border-radius:5px;padding:4px 10px;font-size:12.5px;color:#2d3f5e}
.tec{background:#F7FAFE;border-left:3px solid var(--celeste);padding:13px 16px;border-radius:0 6px 6px 0}
.tec p{font-size:13.2px;color:#2b3b56}

.pie{padding:26px 54px 34px;color:var(--gris);font-size:12px;border-top:1px solid var(--linea)}
.vacio{padding:70px 54px;text-align:center;color:var(--gris)}
.vacio h2{color:var(--navy);font-size:22px}
.vacio code{background:#eef3fa;padding:2px 7px;border-radius:4px;font-size:13px}

@media (max-width:820px){ .bloques{grid-template-columns:1fr} .portada,.ficha,.pie{padding-left:26px;padding-right:26px} }
@media print{
  body{background:#fff}
  .barra,.aviso{display:none!important}
  .hoja{max-width:none;margin:0;box-shadow:none;border-radius:0}
  .ficha{padding:22px 0;page-break-inside:avoid}
  .portada{padding:24px 0 20px}
  @page{size:A4;margin:14mm 13mm}
}
</style>
</head>
<body>

<div class="barra">
  <h1>Anexo de especificaciones técnicas</h1>
  <span class="sep"></span>
  <button class="btn sec" onclick="cargarDeCotizacion()">Traer de la cotización</button>
  <button class="btn" onclick="window.print()">Imprimir o guardar en PDF</button>
</div>
<div class="aviso" id="aviso" hidden></div>

<div class="hoja" id="hoja"></div>

<script>
(function(){
  var D = window.SALAS_ESPECIFICACIONES || {};

  function esc(t){ return String(t==null?'':t).replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  // Los textos vienen separados por «·»: se muestran como etiquetas, que se leen mucho mejor
  function chips(t){
    if(!t) return '';
    var p = String(t).split('·').map(function(x){return x.trim();}).filter(Boolean);
    if(p.length < 2) return '<p>'+esc(t)+'</p>';
    return '<div class="chips">'+p.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>';
  }

  function bloque(titulo, contenido, clase){
    if(!contenido) return '';
    return '<div class="bloque '+(clase||'')+'"><h4>'+titulo+'</h4>'+contenido+'</div>';
  }

  function ficha(sku, i){
    var d = D[sku];
    if(!d) return '<div class="ficha"><div class="cab"><span class="num">'+i+'</span>'+
      '<h3>'+esc(sku)+'</h3></div><p class="intro">Este producto todavía no tiene ficha cargada.</p></div>';
    var codigo = d.oc ? d.oc : sku;
    var tec = [d.tec, d.cat].filter(Boolean).join('  ·  ');
    return '<div class="ficha">'+
      '<div class="cab"><span class="num">'+i+'</span><h3>'+esc(d.n)+'</h3>'+
        '<span class="cod">'+esc(codigo)+'</span></div>'+
      (d.que ? '<p class="intro">'+esc(d.que)+'</p>' : '')+
      '<div class="bloques">'+
        bloque('Qué se trabaja con él', chips(d.trab))+
        bloque('Indicado para', chips(d.ind))+
        bloque('Qué incluye la entrega', d.inc ? '<p>'+esc(d.inc)+'</p>' : '', 'ancho')+
        bloque('Características y especificaciones técnicas',
               tec ? '<div class="tec"><p>'+esc(tec)+'</p></div>' : '', 'ancho')+
      '</div></div>';
  }

  function fecha(){
    var m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var f=new Date();
    return f.getDate()+' de '+m[f.getMonth()]+' de '+f.getFullYear();
  }

  window.pintar = function(skus, info){
    info = info || {};
    var hoja = document.getElementById('hoja');
    if(!skus || !skus.length){
      hoja.innerHTML = '<div class="franja"></div><div class="vacio"><h2>No hay productos seleccionados</h2>'+
        '<p>Marca los productos en la cotización y pulsa <b>Traer de la cotización</b>,<br>'+
        'o abre esta página con los códigos en la dirección:<br><br>'+
        '<code>AnexoEspecificaciones.html?skus=BJ-EX04,BJ-LTUB,BJ-LRIN</code></p></div>';
      return;
    }
    var n = 0;
    var fichas = skus.map(function(s){ n++; return ficha(s, n); }).join('');
    hoja.innerHTML =
      '<div class="franja"></div>'+
      '<div class="portada">'+
        '<img src="oct-logo-horiz.png" alt="OpenCluster" onerror="this.style.display=\'none\'">'+
        '<div class="rot">Anexo a la cotización</div>'+
        '<h2>Especificaciones técnicas<br>de los productos cotizados</h2>'+
        '<p>Este documento acompaña a la cotización y detalla, producto por producto, qué es cada '+
        'equipo, qué se trabaja con él, para qué perfiles está indicado, qué incluye la entrega y '+
        'sus características técnicas.</p>'+
        '<div class="meta">'+
          (info.cliente ? '<div><b>Cliente</b>'+esc(info.cliente)+'</div>' : '')+
          (info.num ? '<div><b>Cotización</b>'+esc(info.num)+'</div>' : '')+
          '<div><b>Productos</b>'+skus.length+'</div>'+
          '<div><b>Fecha</b>'+fecha()+'</div>'+
        '</div>'+
      '</div>'+
      fichas+
      '<div class="pie">Los datos técnicos corresponden a la información publicada por el fabricante. '+
      'OpenCluster Technologies · Construyendo Inclusión</div>'+
      '<div class="franja"></div>';
    document.title = 'Especificaciones técnicas'+(info.num? ' · '+info.num : '');
  };

  // 1) por la dirección:  ?skus=BJ-EX04,BJ-LTUB
  function deLaUrl(){
    var p = new URLSearchParams(location.search);
    var s = p.get('skus');
    if(!s) return null;
    return { skus: s.split(',').map(function(x){return x.trim();}).filter(Boolean),
             info: { cliente: p.get('cliente')||'', num: p.get('num')||'' } };
  }

  // 2) de lo que la página de salas ya deja al enviar a cotización
  window.cargarDeCotizacion = function(){
    var av = document.getElementById('aviso');
    var crudo = null;
    try { crudo = localStorage.getItem('oc_sala_pendiente'); } catch(e){}
    if(!crudo){
      av.hidden = false;
      av.textContent = 'No encontré una cotización pendiente. Marca los productos en la página de salas y vuelve a pulsar el botón.';
      return;
    }
    var skus = [], info = {};
    try {
      var j = JSON.parse(crudo);
      var lista = Array.isArray(j) ? j : (j.items || j.productos || []);
      lista.forEach(function(it){
        var s = it.sku || it.SKU || it.codigo || it.ref || '';
        if(s) skus.push(String(s).trim());
      });
      info.cliente = j.cliente || ''; info.num = j.num || '';
    } catch(e){
      av.hidden = false; av.textContent = 'La cotización pendiente no se pudo leer.'; return;
    }
    var sinFicha = skus.filter(function(s){ return !D[s]; });
    av.hidden = !sinFicha.length;
    if(sinFicha.length) av.textContent = 'Sin ficha todavía: '+sinFicha.join(', ')+'. Salen en el documento como pendientes.';
    window.pintar(skus, info);
  };

  var url = deLaUrl();
  if(url) window.pintar(url.skus, url.info);
  else {
    // al abrirla sin nada, se intenta la cotización pendiente; si no hay, sale la pantalla de ayuda
    var hay = null; try { hay = localStorage.getItem('oc_sala_pendiente'); } catch(e){}
    if(hay) window.cargarDeCotizacion(); else window.pintar([]);
  }
})();
</script>
</body>
</html>
