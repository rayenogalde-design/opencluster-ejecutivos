<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anexo de especificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="EspecificacionesSala.js"></script>
<script src="SalasCodigosOC.js"></script>
<script src="SalasACotizacion.js"></script>
<style>
/* Documento comercial impreso: un solo mundo visual, claro, a propósito.
   Sistema de la cotización: navy #001A60, celeste #06B3FD, Segoe UI. */
:root{
  --navy:#001A60;
  --tinta:#0C1B34;          /* casi negro con sesgo azul, no gris puro */
  --celeste:#06B3FD;
  --celeste-h:#0472B8;
  --naranjo:#FF7E00;        /* el tercer color de la marca; faltaba */
  --naranjo-t:#B35800;      /* el mismo, legible en texto chico */
  --gris:#41527A;           /* azul apagado, NO gris: la marca no tiene gris */
  --gris-cl:#5E6E92;
  --regla:#DCE3EC;
  --regla-f:#EDF1F6;
  --papel:#FFFFFF;
  --mesa:#E9EDF3;
  --crema:#FFF4EA;         /* los dos de la ficha tecnica de producto */
  --crema-b:#F0D9BD;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mesa);color:var(--tinta);
  font:15px/1.6 'Open Sans',"Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  font-variant-numeric:tabular-nums}

/* ── barra de trabajo, no se imprime ───────────────────────────── */
.barra{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:11px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.barra h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.4px;text-transform:uppercase;opacity:.85}
.barra .sep{flex:1}
.btn{font:inherit;font-size:13px;background:var(--celeste);color:#00214d;border:0;
  border-radius:3px;padding:8px 15px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:#bcd9f5;border:1px solid #38538f;font-weight:600}
.btn:focus-visible{outline:2px solid #7fd4ff;outline-offset:2px}
.aviso{background:#FFF8E8;color:#8A5A00;padding:10px 24px;font-size:13px;border-bottom:1px solid #F0E2C0}

/* ── la hoja ───────────────────────────────────────────────────── */
.hoja{max-width:900px;margin:28px auto 64px;background:var(--papel);border:1px solid var(--regla)}
.filo{height:3px;background:linear-gradient(90deg,var(--navy),var(--celeste-h) 62%,var(--celeste))}

/* ── portada ───────────────────────────────────────────────────── */
.portada{padding:46px 58px 30px;border-bottom:2px solid var(--naranjo)}
.portada img{height:118px;width:auto;margin-bottom:26px}
.epi{font-family:'Montserrat','Segoe UI',sans-serif;font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--naranjo-t);font-weight:700}
/* OPCION A - el nombre del proyecto en naranjo degradado */
.portada h2{font-family:'Montserrat','Segoe UI',sans-serif;font-size:38px;line-height:1.06;margin:12px 0 2px;font-weight:700;
  letter-spacing:-1.1px;text-wrap:balance;max-width:22ch;
  background:linear-gradient(95deg,#9C4D00 0%,var(--naranjo) 48%,#FFB259 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.portada .estilo{font-family:'Montserrat','Segoe UI',sans-serif;display:block;font-size:25px;font-weight:600;letter-spacing:-.5px;line-height:1.2;
  margin-bottom:20px;color:var(--navy)}
.portada .bajada{margin:0;color:#56637A;max-width:56ch;font-size:15px;line-height:1.68}
/* El título lo escribe el ejecutivo aquí mismo. En papel no se nota que era editable. */
[contenteditable]:empty:before{content:attr(data-vacio);opacity:.38;font-weight:inherit}
[contenteditable]:focus{outline:0;background:#F3F9FE;box-shadow:0 0 0 6px #F3F9FE}
@media print{[contenteditable]:empty{display:none}}
.meta{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,auto));
  gap:0 40px;justify-content:start}
.meta div{font-size:14px;color:var(--tinta)}
.meta b{font-family:'Montserrat','Segoe UI',sans-serif;display:block;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--naranjo-t);font-weight:700;margin-bottom:5px}

/* ── ficha de producto ─────────────────────────────────────────── */
/* ── el marco de nuestra ficha tecnica ── */
.fi-head{display:flex;align-items:center;padding:10px 26px 11px;
  background:linear-gradient(170deg,#0A0F1E 0%,var(--navy) 35%,#0A2E8A 60%,var(--celeste) 100%);
  border-bottom:3px solid var(--naranjo)}
.fi-logo{height:26px;width:auto;flex:0 0 auto;margin-left:14px}
.fi-tit{flex:1;display:flex;align-items:center;gap:11px}
.fi-tit h3{font-family:'Montserrat','Segoe UI',sans-serif;margin:0;font-size:19px;font-weight:800;color:#fff;
  line-height:1.14;letter-spacing:-.2px}
/* circulo BLANCO con el numero en navy: el gris translucido se veia sucio */
.fi-num{font-family:'Montserrat','Segoe UI',sans-serif;width:26px;height:26px;border-radius:50%;
  background:#fff;color:var(--navy);font-size:12.5px;font-weight:800;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}

.ficha{padding:14px 40px 10px;border-bottom:0;display:block}
.ficha::after{content:"";display:block;clear:both}
.ficha:last-of-type{border-bottom:0}

.col-izq{float:left;width:196px;margin:2px 26px 16px 0;
  display:flex;flex-direction:column;align-items:stretch;gap:9px}
/* el numero va en la esquinita, arriba del nombre */

.col-izq .cod{display:block;text-align:left;font-size:10px;color:#7A8AA5}
.orden{display:inline-flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:50%;line-height:1;
  background:linear-gradient(135deg,var(--navy),#0A63D8 60%,var(--celeste));
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:0 1px 4px rgba(0,26,96,.22)}
/* Rayen 09-sep: la imagen mas grande DENTRO del mismo marco: se le quito el aire. */
.foto{width:100%;height:162px;object-fit:contain;background:#fff;
  border:1px solid #E6ECF4;padding:6px}
.sinfoto{width:100%;height:162px;border:1px dashed #E6ECF4;
  display:flex;align-items:center;justify-content:center;color:var(--gris-cl);font-size:10px;text-align:center;padding:8px}

.cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}

.cod{font-family:'Montserrat','Segoe UI',sans-serif;font-size:10.5px;letter-spacing:1.2px;color:#5E6E92;font-weight:700;text-transform:uppercase}
.intro{margin:0 0 10px;font-size:13.4px;line-height:1.48;color:#2A374F}

.par{display:grid;grid-template-columns:1fr 1fr;gap:9px 30px;margin-bottom:0;clear:left}
.campo{min-width:0;break-inside:avoid;page-break-inside:avoid;margin-top:17px}
.campo:first-of-type{margin-top:0}
.par{margin-top:17px}
.par .campo{margin-top:0}
.campo.ancho{grid-column:1/-1}
/* «junto» va al costado de la foto; «tras» empieza cuando la foto ya termino */
.campo.junto{margin-bottom:0}
.campo.tras{clear:left}
.campo.ind{margin-bottom:0;clear:both}
/* Rayen 09-sep-2026: los subtitulos como los chips del catalogo — "¿PARA QUE SIRVE?"
   en pildora celeste con el texto azul. Es el mismo recurso que ya usa el catalogo
   de productos, para que los dos documentos se lean como de la misma casa. */
.tit-tec{font-family:'Montserrat','Segoe UI',sans-serif;margin:0 0 5px;text-align:center;
  font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--navy)}
.chip{font-family:'Montserrat','Segoe UI',sans-serif;display:block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:800;color:var(--navy);border-top:1.5px solid var(--crema-b);
  padding:6px 0 0;line-height:1.25}
.campo h4{margin:0 0 7px;break-after:avoid;page-break-after:avoid}
/* En la ficha tecnica, "INDICADO PARA" es lo unico que va sobre fondo naranjo palido:
   es el dato mas vendedor. Se copia igual, con su chip y sus vinetas en naranjo. */
/* Sin fondo: Rayen 09-sep — "quitale el fondo naranjo, redunda mucho con el de
   caracteristicas tecnicas". Queda el chip y los circulitos naranjos. */
.campo.ind{padding:0}
.campo.ind .chip{color:var(--navy)}
.campo.ind .vin-ic{background:var(--naranjo)}
.campo.ind .vin-ic svg{display:none}
.campo.ind .vin li{color:#4A3520;line-height:1.38;margin-bottom:3px}
.campo.ind h4{margin:0 0 7px}
.campo.ind .vin.dos{column-gap:24px}
.campo p{margin:0;font-size:12.6px;line-height:1.5;color:#33415C}
/* Rayen 09-sep-2026: "siempre les poniamos unas bullet bien bonitas a estas cosas".
   La vineta es un SVG inline, como en las fichas del design system: nunca un emoji,
   y en papel sale igual que en pantalla. */
.vin-ic{display:block;width:5px;height:5px;margin:7px 0 0 5px;border-radius:50%;
  background:var(--celeste-h)}
.vin-ic svg{display:none}
.vin{list-style:none;margin:0;padding:0}
.vin li{display:grid;grid-template-columns:11px 1fr;gap:8px;align-items:start;
  font-size:12.5px;line-height:1.38;color:#33415C;margin-bottom:4px;break-inside:avoid}
.vin li:last-child{margin-bottom:0}
/* Dos columnas solo en los campos que ocupan el ancho completo: dentro de una
   columna estrecha partirian las palabras. */
.vin.dos{columns:2;column-gap:30px}
@media screen and (max-width:760px){ .vin.dos{columns:1} }

/* tabla de especificaciones: lo propio de una ficha técnica */
/* Rayen 09-sep-2026: "el recuadro de las caracteristicas tecnicas, imita el de las
   fichas tecnicas, hazlo menos plano, se mimetiza demasiado con lo demas".
   De la ficha se copia: marco propio, filas separadas por linea fina y el VALOR en
   navy y en negrita, que es lo que hace que se lea como una ficha y no como texto. */
/* Rayen 09-sep-2026, con la ficha del ComuniQa a la vista: las especificaciones se
   ven como ahi — filas alternadas en naranjo palido, la etiqueta a la izquierda y el
   VALOR a la derecha en navy y negrita. Sin marco: la banda hace la separacion. */
/* Rayen 09-sep-2026: "el otro diseño, el que tenia sombras: se ve mas organizado y
   trabajado". La sombra es la de nuestras fichas del design package. */
.specs{margin-top:5px;clear:both;break-inside:avoid;page-break-inside:avoid;
  background:#fcfdff;border:1.5px solid var(--navy);border-radius:6px;padding:10px 14px}
.sfila{display:grid;grid-template-columns:48% 1fr;gap:0;align-items:baseline;
  padding:6px 8px;border-bottom:1.5px solid #93b5d6}
.sfila:last-child{border-bottom:none}
.sfila:last-child{border-bottom:0}
/* la etiqueta no se parte: asi cada dato ocupa una sola linea */
/* min-width para que TODOS los valores arranquen a la misma altura, y nowrap para
   que la etiqueta no se parta: asi cada dato ocupa una sola linea */
/* etiqueta a la izquierda, en texto normal, como en la ficha */
.sk{font-size:12.6px;color:var(--navy);font-weight:400}
/* el valor, a la derecha y en navy negrita. Si es una frase larga se alinea a la
   izquierda: alineada a la derecha se lee mal, como ya se vio. */
/* todos los valores anclados a la derecha, tambien las frases largas (Rayen 09-sep) */
.sv{font-size:12.6px;color:var(--navy);font-weight:600;text-align:right}
@media screen and (max-width:760px){ .sfila{grid-template-columns:1fr;gap:0} }
.libre{font-size:12.2px;line-height:1.5;color:#2A374F;padding-top:8px;
  break-inside:avoid;page-break-inside:avoid}

.pie{padding:22px 58px 6px;color:var(--gris);font-size:11.5px;line-height:1.6}

/* ── firma de la ejecutiva ──────────────────────────────────────────────
   Copiada de CotizadorOpenCluster.html (.exec-card), para que el anexo cierre
   igual que la cotizacion que acompana. Los datos salen del perfil que el
   cotizador guarda en «opencluster_perfil_ejecutivo». */
.exec-card{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 58px 26px;background:linear-gradient(135deg,#001a60 0%,#002a90 100%);
  border-radius:7px;padding:8px 14px;
  font-family:'Open Sans',"Segoe UI",system-ui,sans-serif;
  break-inside:avoid;page-break-inside:avoid}
.exec-avatar{width:34px;height:34px;border-radius:50%;background:var(--celeste);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  color:#fff;flex-shrink:0}
.exec-info{flex:1}
.exec-name{font-size:11.5px;font-weight:700;color:#fff;line-height:1.25}
.exec-role{font-size:9.5px;color:var(--celeste);line-height:1.25}
.exec-dept{font-size:9px;color:rgba(255,255,255,.45);line-height:1.25}
.exec-contacts{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.exec-contact{font-size:9.5px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:4px}
.vacio{padding:72px 58px;text-align:center;color:var(--gris)}
.vacio h2{color:var(--navy);font-size:21px;margin:0 0 12px;font-weight:700}
.vacio code{background:#F0F4F9;border:1px solid var(--regla);padding:3px 8px;font-size:12.5px}

@media screen and (max-width:760px){
  .ficha{grid-template-columns:1fr;gap:18px}
  .col-izq{align-items:stretch}
  .foto,.sinfoto{width:100%;max-width:260px}
  .par{grid-template-columns:1fr}
  .portada,.ficha,.pie{padding-left:24px;padding-right:24px}
}
/* PIE DE HOJA — Rayen 09-sep-2026: "mi firma va solo en la ultima pagina; las paginas
   intermedias tengan la pagina web y el isotipo", y "ponlo lo mas abajo, de lo contrario
   siempre va a quedar mezclado con la informacion".
   NO se usa «position:fixed»: en impresion Chrome lo ancla donde quiere y termina cayendo
   entre el contenido. Va DENTRO de cada hoja de producto, empujado al fondo con
   «margin-top:auto». Cada producto ocupa su hoja, asi que el pie cae siempre abajo y la
   firma queda sola en la ultima pagina. En pantalla no se ve. */
.pie-ficha{display:none}
.pie-hoja{display:none}
@media print{
  /* la portada va sola en la primera hoja */
  .portada{page-break-after:always;break-after:page}
  /* una hoja por producto: asi el pie cae al fondo de cada una y la firma queda sola */
  .fi-head{break-after:avoid;page-break-after:avoid}
  /* los filos son adorno de pantalla; en papel se caian a una hoja extra */
  .filo{display:none}
  /* Un producto detras de otro, con aire entre ellos. «break-inside:avoid» es la regla
     que IMPIDE que un producto se corte entre dos hojas: si no cabe en lo que queda,
     salta completo a la siguiente. Rayen 09-sep-2026: "es un lio cuando queda la imagen
     alla y el resto en otra". */
  .prod{display:block;margin-bottom:11mm;break-inside:avoid;page-break-inside:avoid}
  .prod:last-of-type{margin-bottom:0}
  .empuje{display:none}
  .pie-ficha{display:none}
  /* sin pie fijo: se repetia al final de una hoja y al comienzo de la siguiente */
  .pie{padding:8px 0 3px;font-size:10.5px;line-height:1.45}
  .exec-card{margin:0;padding:6px 12px;break-inside:avoid;page-break-inside:avoid}
  .prod .ficha{border-bottom:0;padding-bottom:0}
  /* bloque con el texto a la derecha: mas seguro que un flex para que el pie quede
     siempre pegado al margen derecho de la hoja */
  body{background:#fff}
  .barra,.aviso{display:none!important}
  .hoja{max-width:none;margin:0;border:0}
  .ficha{padding:20px 0;page-break-inside:avoid}
  .portada{padding:10px 0 22px}
  .pie{padding:18px 0 0}
  /* Rayen: "no la quiero en A4, la quiero siempre en tamaño carta" */
  /* Rayen: el pie queda muy arriba. La franja de abajo baja de 22 a 14 mm, asi el
     isotipo y la web quedan a poco mas de 1 cm del borde de la hoja. */
  @page{size:letter;margin:11mm 13mm 9mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="barra">
  <h1>Anexo de especificaciones</h1>
  <span class="sep"></span>
  <button class="btn sec" onclick="cargarDeCotizacion()">Traer de la cotización</button>
  <button class="btn" onclick="window.print()">Guardar en PDF</button>
</div>
<div class="aviso" id="aviso" hidden></div>
<div class="hoja" id="hoja"></div>


<script>
(function(){
  var D = window.SALAS_ESPECIFICACIONES || {};
  var CAT = window.SALAS_CATALOGO || {};

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function llave(t){ return String(t==null?'':t).toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }

  /* La cotización no viaja con el SKU del fabricante: viaja con el código OC de
     nuestra lista y con el nombre. Se busca en ese orden. */
  var PORCOD = {}, PORNOM = {};
  Object.keys(D).forEach(function(sku){
    var d = D[sku];
    if(d.oc) PORCOD[llave(d.oc)] = sku;
    PORNOM[llave(d.n)] = sku;
    if(d.fam && !PORNOM[llave(d.fam)]) PORNOM[llave(d.fam)] = sku;
  });
  function resolver(it){
    if(typeof it === 'string'){
      if(D[it]) return it;
      var k = llave(it);
      return PORCOD[k] || PORNOM[k] || it;
    }
    var sku = it.sku || it.SKU || it.ref;
    if(sku && D[sku]) return sku;
    var oc = it.codigo || it.oc || it.cod;
    if(oc && PORCOD[llave(oc)]) return PORCOD[llave(oc)];
    var nom = it.nombre || it.n || it.producto;
    if(nom && PORNOM[llave(nom)]) return PORNOM[llave(nom)];
    return sku || oc || nom || '';
  }

  /* Las dos fuentes del fabricante dicen lo mismo con otras palabras: la ficha del
     portal de soporte trae «Altura total de 180 cm» y el catálogo «Altura 180 cm».
     Para no repetirlo se compara por CIFRA CON SU UNIDAD, no por texto: un trozo cuyas
     cifras ya salieron todas, con la misma unidad, no aporta nada y se descarta.
     Ligar la unidad a la cifra evita confundir «alcance 30 m» con «altura 30 cm». */
  var UNI = /^(cm|mm|m|km|kg|g|mg|v|w|kw|a|ma|mah|ah|hz|khz|mhz|ghz|gb|mb|tb|ω|ohm|lm|lux|nits|pulgadas|["”]|g\/m|%|°|k)$/i;
  function cifras(x){
    var tk = x.replace(/[·,;()]/g,' ').split(/\s+/).filter(Boolean);
    var pares = [];
    tk.forEach(function(t,i){
      if(!/^\d+([.,]\d+)?$/.test(t)) return;
      var u = '';
      for(var j=i+1;j<tk.length && j<i+4;j++){
        var c = tk[j].replace(/[²³]/g,'').toLowerCase();
        if(UNI.test(c)){ u = c; break; }
      }
      pares.push(t.replace(',','.').replace(/\.0+$/,'') + '|' + u);
    });
    return pares;
  }
  /* Lo que NO va en un documento para el cliente. Rayen 09-sep-2026: los requisitos del
     equipo informatico no aplican, porque el computador se lo entregamos nosotros. */
  var FUERA = /^(requisitos m[íi]nimos|requerimientos m[íi]nimos)/i;
  function sirveParaElCliente(x){ return !FUERA.test(String(x).trim()); }

  function unir(a,b,yaDicho){
    var dicho = [];
    if(yaDicho) String(yaDicho).split(/[,.]/).forEach(function(x){
      var k = llave(x); if(k.length > 4) dicho.push(k);
    });
    var t = [a,b].filter(Boolean).join(' · ');
    var trozos = t.split(/·|(?<=\.)\s+(?=[A-ZÁÉÍÓÚÑ])/)
      .map(function(x){return x.trim().replace(/\.$/,'');}).filter(Boolean);
    var vistoTxt = [], vistoNum = {}, salida = [];
    trozos.forEach(function(x){
      var k = llave(x).replace(/^(de|del|la|el|con|y|en)/,'');
      if(k.length < 3) return;
      if(vistoTxt.some(function(v){ return v===k || v.indexOf(k)>-1 || k.indexOf(v)>-1; })) return;
      var c = cifras(x);
      if(c.length && c.every(function(p){ return vistoNum[p]; })) return;
      c.forEach(function(p){ vistoNum[p] = 1; });
      vistoTxt.push(k); salida.push(x);
    });
    return salida.filter(sirveParaElCliente).filter(function(x){
      var k = llave(x);
      /* si el trozo ya esta nombrado en "que incluye la entrega", no se repite */
      return !dicho.some(function(d){ return k===d || (k.length>4 && d.indexOf(k)>-1) || (d.length>4 && k.indexOf(d)>-1); });
    });
  }

  /* Una ficha técnica se lee como pares dato/valor, no como un párrafo.
     Se parte cada trozo en su etiqueta y su valor cuando la tiene. */
  var ETIQ = /^(medidas?|dimensiones( externas)?|alimentaci[óo]n|entrada|salida[s]?|potencia|consumo|peso|bater[íi]a|carga|tensi[óo]n|voltaje|frecuencia|di[áa]metro|altura|ancho|largo|longitud|espesor|grosor|resoluci[óo]n|brillo|contraste|pantalla|impedancia|temperatura|capacidad|tejido|espuma[s]?|material(es)?|estructura|conexi[óo]n|cable|control(ador)?|radiofrecuencia|amplificaci[óo]n|velocidad|rosca|protecci[óo]n|unidad|puerto|audio|alcance|memoria|almacenamiento|procesador|sistema operativo|software|fuente de alimentaci[óo]n|grado de protecci[óo]n|fibra [óo]ptica|aplicaci[óo]n|fijaci[óo]n)\b[:\s]*/i;
  /* «Entrada de 100 a 240 V» se lee mejor como Entrada → 100 a 240 V. */
  function valor(v){
    v = v.replace(/^(de|del|por|con|en|a)\s+/i,'').replace(/^[:\s]+/,'');
    return v.charAt(0).toUpperCase() + v.slice(1);
  }
  /* «specs» arma la tabla; «adicionales» devuelve lo que no es par dato/valor. */
  function partir(trozos){
    var pares = [], libres = [];
    trozos.forEach(function(x){
      var m = x.match(ETIQ);
      if(m && x.length > m[0].length + 2){
        var et = m[0].replace(/[:\s]+$/,'');
        pares.push([et, valor(x.slice(m[0].length))]);
      } else libres.push(x);
    });
    return {pares: pares, libres: libres};
  }

  function specs(trozos){
    var p = partir(trozos).pares;
    if(p.length < 2) return '';
    return '<div class="specs">' + p.map(function(x){
      return '<div class="sfila"><span class="sk">'+esc(x[0])+'</span>'+
             '<span class="sv">'+esc(x[1])+'</span></div>';
    }).join('') + '</div>';
  }

  /* Rayen 09-sep-2026: "dale mas importancia a ese parrafo, queda en gris como si no
     fuera importante; ponlo en una categoria que se llame caracteristicas adicionales". */
  function adicionales(trozos){
    var r = partir(trozos);
    var txt = (r.pares.length >= 2) ? r.libres : trozos;
    if(!txt.length) return '';
    return '<p>'+esc(txt.join('. '))+'.</p>';
  }

  function _specsViejo(trozos){
    var pares = partir(trozos).pares, libres = partir(trozos).libres;
    var html = '';
    if(pares.length >= 2){
      html += '<div class="specs">' + pares.map(function(p){
        return '<div class="sfila"><span class="sk">'+esc(p[0])+'</span>'+
               '<span class="sv">'+esc(p[1])+'</span></div>';
      }).join('') + '</div>';
      /* sin cifras no es un dato tecnico: es repetir lo de arriba con otras palabras */
      var conDato = libres.filter(function(x){ return /d/.test(x); });
      if(conDato.length) html += '<p class="libre">'+esc(conDato.join('. '))+'.</p>';
    } else if(trozos.length){
      html = '<p class="libre" style="padding-top:0">'+esc(trozos.join('. '))+'.</p>';
    }
    return html;
  }

  /* La lista con vineta. «ancho» dice si el campo ocupa toda la hoja: solo ahi caben
     dos columnas. El SVG va inline y el CSS decide como se ve. */
  var VIN = '<span class="vin-ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+
            '<polyline points="20 6 9 17 4 12"/></svg></span>';
  function lista(p, ancho){
    var cls = (ancho && p.length >= 4) ? "vin dos" : "vin";
    return '<ul class="'+cls+'">'+p.map(function(x){
      return '<li>'+VIN+'<span>'+esc(x)+'</span></li>';
    }).join('')+'</ul>';
  }
  /* "Que incluye la entrega" llega como un texto con comas. Se parte en vinetas solo si
     de verdad es una enumeracion: tres piezas o mas y ninguna sospechosamente corta. */
  function incluye(t, ancho){
    if(ancho === undefined) ancho = true;
    if(!t) return '';
    var s = String(t).trim().replace(/.$/, '');
    var p = s.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    if(p.length < 3 || p.some(function(x){ return x.length < 4; })) return '<p>'+esc(s)+'.</p>';
    return lista(p, ancho);
  }
  function enumera(t, ancho){
    if(!t) return '';
    var p = String(t).split('·').map(function(x){return x.trim().replace(/\.$/,'');}).filter(Boolean);
    if(p.length < 2) return '<p>'+esc(t)+'</p>';
    return lista(p, !!ancho);
  }
  function campo(t,c,cl){ return c ? '<div class="campo '+(cl||'')+'"><h4><span class="chip">'+t+'</span></h4>'+c+'</div>' : ''; }

  function foto(sku,d){
    var c = CAT[sku];
    var src = (c && c.img) ? c.img : '';
    if(!src) return '<div class="sinfoto">sin foto</div>';
    return '<img class="foto" src="'+esc(src)+'" alt="'+esc(d.n)+'" loading="lazy" '+
           'onerror="this.outerHTML=\'<div class=&quot;sinfoto&quot;>sin foto</div>\'">';
  }

  function ficha(sku,i,ultimo){
    var d = D[sku];
    if(!d) return '<section class="prod"><div class="ficha"><div class="col-izq">'+
      '<span class="orden">'+i+'</span></div>'+
      '<div><div class="cab"><h3>'+esc(sku)+'</h3></div>'+
      '<p class="intro">Este producto todavía no tiene ficha cargada.</p></div></div></section>';
    /* El marco es el de NUESTRA ficha tecnica de producto (GeneradorFichasSlides.html):
       banner navy con el logo y, donde esa ficha dice "FICHA TECNICA DE PRODUCTO", el
       NOMBRE del producto. Rayen 09-sep-2026: "trabajamos tanto tiempo en ese diseño y
       llegamos a uno que se parecia mas a nosotros". La foto va sobre el crema de la
       ficha, con el codigo OC debajo, y el resto de la informacion flota alrededor. */
    return '<section class="prod">'+
      '<header class="fi-head">'+
        /* numero y nombre a la izquierda; el isotipo cierra a la derecha */
        '<div class="fi-tit"><span class="fi-num">'+i+'</span><h3>'+esc(d.n)+'</h3></div>'+
        '<img class="fi-logo" src="isotipo-oct.png" alt="">'+
      '</header>'+
      '<div class="ficha">'+
        '<div class="col-izq">'+
          foto(sku,d)+
          '<span class="cod">'+esc(d.oc||sku)+'</span>'+
        '</div>'+
      '<div>'+
        (d.que ? '<h4 class="campo"><span class="chip">¿Para qué sirve?</span></h4>'+
                 '<p class="intro">'+esc(d.que)+'</p>' : '')+
        campo('¿Qué se trabaja con él?', enumera(d.trab), 'junto')+
        campo('¿Qué incluye la entrega?', incluye(d.inc, true), 'ancho tras')+
        campo('¿Para quién está indicado?', enumera(d.ind, true), 'ancho ind')+
        (function(){
           var tro = unir(d.tec,d.cat,d.inc);
           var tabla = specs(tro), extra = adicionales(tro);
           return (tabla ? '<div class="campo ancho"><h4 class="tit-tec">Especificaciones técnicas</h4>'+tabla+'</div>' : '')+
                  (extra ? campo('Características adicionales', extra, 'ancho') : '');
         })()+
      '</div></div>'+   /* cierra la columna del contenido Y la rejilla de la ficha */
      '</div>'+          /* cierra .ficha: lo que sigue es hermano, no contenido */
      '<div class="empuje"></div>'+
      (ultimo
        ? '<div class="pie">Los datos técnicos corresponden a la información publicada por el '+
          'fabricante de los equipos.<br>OpenCluster Technologies · Construyendo Inclusión · www.opencluster-tech.cl</div>'
        : '')+
      '</section>';
  }

  /* Firma de cierre. Los datos son los del perfil que guarda el cotizador
     («opencluster_perfil_ejecutivo»); si no hay perfil, los de Rayen, que es el
     mismo respaldo que usa CotizadorOpenCluster.html. */
  function firma(){
    var p = {};
    try{ p = JSON.parse(localStorage.getItem('opencluster_perfil_ejecutivo')||'{}') || {}; }catch(e){}
    var nom   = p.eExecNombre || 'Rayen Ogalde';
    var cargo = p.eExecCargo  || 'Encargada de Difusión y Vínculos Institucionales';
    var depto = p.eExecDepto  || 'Departamento Comercial — OpenCluster Tech';
    var tel   = p.eExecTel    || '+56 9 5629 4723';
    var mail  = p.eExecEmail  || 'rayen.ogalde@opencluster-tech.cl';
    var ini = nom.split(/ +/).filter(Boolean).map(function(w){return w[0];})
                 .join('').toUpperCase().slice(0,2) || 'RO';
    return '<div class="exec-card">'+
      '<div class="exec-avatar">'+esc(ini)+'</div>'+
      '<div class="exec-info">'+
        '<div class="exec-name">'+esc(nom)+'</div>'+
        '<div class="exec-role">'+esc(cargo)+'</div>'+
        '<div class="exec-dept">'+esc(depto)+'</div>'+
      '</div>'+
      '<div class="exec-contacts">'+
        (tel  ? '<div class="exec-contact"><span>📞</span> <span>'+esc(tel)+'</span></div>' : '')+
        (mail ? '<div class="exec-contact"><span>✉️</span> <span>'+esc(mail)+'</span></div>' : '')+
        '<div class="exec-contact"><span>🌐</span> <span>www.opencluster-tech.cl</span></div>'+
      '</div>'+
    '</div>';
  }

  function fecha(){
    var m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var f=new Date();
    return f.getDate()+' de '+m[f.getMonth()]+' de '+f.getFullYear();
  }

  window.pintar = function(skus, info){
    info = info || {};
    var hoja = document.getElementById('hoja');
    if(!skus || !skus.length){
      hoja.innerHTML = '<div class="filo"></div><div class="vacio"><h2>Todavía no hay productos</h2>'+
        '<p>Marca los productos en la cotización y pulsa <b>Traer de la cotización</b>, o abre esta '+
        'página con los códigos en la dirección:</p><p><code>AnexoEspecificaciones.html?codigos=OC-1829,OC-1622</code></p></div>';
      return;
    }
    var n = 0;
    hoja.innerHTML =
      '<div class="filo"></div>'+
      '<div class="portada">'+
        '<img src="oct-logo-cot.png" alt="OpenCluster" onerror="this.style.display=\'none\'">'+
        '<div class="epi">Anexo a la cotización</div>'+
        '<h2 contenteditable="true" spellcheck="false" data-vacio="Proyecto Escuela …">'+
          esc(info.proyecto || '')+'</h2>'+
        '<span class="estilo" contenteditable="true" spellcheck="false" data-vacio="Sala Multisensorial SHX">'+
          esc(info.estilo || '')+'</span>'+
        '<p class="bajada">Les presentamos el detalle de los productos sugeridos para su sala, '+
        'para que los conozcan y puedan evaluarlos: qué es cada equipo, qué se trabaja con él, '+
        'para qué perfiles está indicado, qué incluye la entrega y sus características técnicas.</p>'+
        '<div class="meta">'+
          (info.cliente ? '<div><b>Cliente</b>'+esc(info.cliente)+'</div>' : '')+
          (info.num ? '<div><b>Cotización</b>'+esc(info.num)+'</div>' : '')+
          '<div><b>Equipos</b>'+skus.length+'</div>'+
          '<div><b>Fecha</b>'+fecha()+'</div>'+
        '</div>'+
      '</div>'+
      skus.map(function(s,ix){ n++; return ficha(s,n,ix===skus.length-1); }).join('')+
      '<div class="filo"></div>';
    document.title = info.proyecto || ('Especificaciones'+(info.num ? ' · '+info.num : ''));
    /* se pagina en cuanto las fotos tengan medida, y otra vez al imprimir */
    /* en flujo continuo no se pagina ni se reparte aire: el documento corre solo */
  };

  function deLaUrl(){
    var p = new URLSearchParams(location.search);
    var s = p.get('codigos') || p.get('skus');
    if(!s) return null;
    return { skus: s.split(',').map(function(x){return resolver(x.trim());}).filter(Boolean),
             info:{ cliente:p.get('cliente')||'', num:p.get('num')||'',
                    proyecto:p.get('proyecto')||'', estilo:p.get('estilo')||'' } };
  }

  window.cargarDeCotizacion = function(){
    var av = document.getElementById('aviso'), crudo = null;
    /* «oc_anexo_pendiente» la deja el cotizador al pedir el anexo.
       «oc_sala_pendiente» es la del envío a cotización, y el cotizador la CONSUME al cargarla. */
    try { crudo = localStorage.getItem('oc_anexo_pendiente') || localStorage.getItem('oc_sala_pendiente'); } catch(e){}
    if(!crudo){
      av.hidden = false;
      av.textContent = 'No hay una cotización esperando. Marca los productos en la página de salas y vuelve a pulsar el botón. Si ya pasaste por el cotizador, pide el anexo desde ahí: la cotización se consume al cargarse.';
      return;
    }
    var skus = [], info = {};
    try{
      var j = JSON.parse(crudo);
      (Array.isArray(j) ? j : (j.productos || j.items || [])).forEach(function(it){
        var s = resolver(it); if(s) skus.push(String(s).trim());
      });
      info.cliente = j.cliente || ''; info.num = j.num || '';
      info.proyecto = j.proyecto || ''; info.estilo = j.estilo || j.modalidad || '';
    }catch(e){ av.hidden=false; av.textContent='La cotización no se pudo leer.'; return; }
    /* Un producto sin ficha no puede salir en un documento que va al cliente: se queda
       fuera y se avisa aquí arriba, que es lo único que no se imprime. */
    var sinFicha = skus.filter(function(s){ return !D[s]; });
    var conFicha = skus.filter(function(s){ return D[s]; });
    av.hidden = !sinFicha.length;
    if(sinFicha.length) av.textContent = 'Sin ficha todavía, así que NO salen en el documento: '+
      sinFicha.join(', ')+'. Los demás sí están.';
    window.pintar(conFicha, info);
  };

  /* alto util de una hoja carta con los margenes de @page, en pixeles de CSS */
  var HOJA_MM = 252, MM = 96/25.4, HOJA_PX = HOJA_MM * MM;

  /* Tope alto a proposito: con poca informacion las secciones se separan y llenan la
     hoja de forma uniforme, en vez de quedar apretadas arriba con un vacio abajo. */
  var AIRE_TOPE = 58;

  /* alto real de lo que hay dentro de una hoja, sin contar el espaciador */
  function altoContenido(prod){
    var s = 0;
    [].slice.call(prod.children).forEach(function(el){
      if(el.classList.contains('empuje')) return;
      var cs = getComputedStyle(el);
      s += el.offsetHeight + (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0);
    });
    return s;
  }

  /* la caja donde de verdad viven los bloques de contenido */
  function cajaDe(prod){
    var ficha = prod.querySelector('.ficha');
    if(!ficha) return null;
    var hijos = [].slice.call(ficha.children);
    for(var k=0;k<hijos.length;k++){
      if(!hijos[k].classList.contains('col-izq') && hijos[k].tagName === 'DIV'
         && hijos[k].children.length > 1) return hijos[k];
    }
    return ficha;
  }

  window.repartirAire = function(){
    [].slice.call(document.querySelectorAll('.prod')).forEach(function(prod){
      var caja = cajaDe(prod);
      if(!caja) return;
      var bloques = [].slice.call(caja.children).filter(function(el){
        return !el.classList.contains('col-izq');   /* la foto flota: no cuenta */
      });
      if(bloques.length < 2) return;
      bloques.forEach(function(el){ el.style.marginBottom = ''; });
      /* colchon de 18 px: el aire nunca debe empujar la hoja a partirse */
      var sobra = HOJA_PX - altoContenido(prod) - 18;
      if(sobra <= 10) return;
      var huecos = bloques.length - 1;
      var extra = Math.min(sobra / huecos, AIRE_TOPE);
      /* el aire va ANTES de cada rotulo, nunca entre el rotulo y su texto */
      var puntos = [];
      for(var k=0; k<huecos; k++){
        var sig = bloques[k+1];
        var esRotulo = sig && (sig.tagName === 'H4' || sig.querySelector && sig.querySelector('.chip'));
        if(esRotulo) puntos.push(bloques[k]);
      }
      if(!puntos.length) return;
      var extra2 = Math.min(sobra / puntos.length, AIRE_TOPE);
      puntos.forEach(function(el){
        var actual = parseFloat(getComputedStyle(el).marginBottom) || 0;
        el.style.marginBottom = (actual + extra2) + 'px';
      });
    });
  };

  window.paginar = function(){
    var hojas = [].slice.call(document.querySelectorAll('.prod'));
    hojas.forEach(function(prod){
      var vueltas = 0;
      while(altoContenido(prod) > HOJA_PX && vueltas < 12){
        vueltas++;
        var caja = cajaDe(prod);
        var mover = caja ? [].slice.call(caja.children).filter(function(el){
          return el.classList.contains('campo') || el.classList.contains('specs');
        }) : [];
        if(!mover.length) break;
        /* la hoja nueva hereda el banner, con el nombre y la marca de continuacion */
        var sig = document.createElement('section');
        sig.className = 'prod';
        var cab = prod.querySelector('.fi-head').cloneNode(true);
        var h3 = cab.querySelector('h3');
        if(h3 && h3.textContent.indexOf('(continúa)') < 0) h3.textContent = h3.textContent + ' (continúa)';
        sig.appendChild(cab);
        var f2 = document.createElement('div');
        f2.className = 'ficha';
        var c2 = document.createElement('div');
        f2.appendChild(c2);
        sig.appendChild(f2);
        var emp = document.createElement('div'); emp.className = 'empuje'; sig.appendChild(emp);
        /* el cierre de la hoja: si la que se parte traia la firma, la firma viaja */
        var cierre = prod.querySelector('.exec-card') ? null : prod.querySelector('.pie-ficha');
        if(prod.querySelector('.exec-card')){
          sig.appendChild(prod.querySelector('.pie'));
          sig.appendChild(prod.querySelector('.exec-card'));
          var pf = document.createElement('div');
          pf.className = 'pie-ficha';
          pf.innerHTML = '<img src="isotipo-oct.png" alt=""><span>www.opencluster-tech.cl</span>';
          prod.appendChild(pf);
        } else if(cierre){
          sig.appendChild(cierre.cloneNode(true));
        }
        /* se pasa el ultimo bloque, y se repite hasta que la hoja cierre */
        c2.appendChild(mover[mover.length-1]);
        prod.parentNode.insertBefore(sig, prod.nextSibling);
        prod = sig;   /* la hoja nueva tambien se revisa */
      }
    });
  };

  var u = deLaUrl();


  if(u) window.pintar(u.skus, u.info);
  else{
    var hay = null; try{ hay = localStorage.getItem('oc_anexo_pendiente') || localStorage.getItem('oc_sala_pendiente'); }catch(e){}
    if(hay) window.cargarDeCotizacion(); else window.pintar([]);
  }
})();
</script>
