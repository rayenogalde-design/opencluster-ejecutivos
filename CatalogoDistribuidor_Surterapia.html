<!DOCTYPE html>
<!-- SURTERAPIA INHABILITADA -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Catálogo en actualización · OpenCluster Tech</title>
<style>
  :root{--navy:#001A60;--texto:#1F2937;--suave:#6B7280;--fondo:#FAFBFC;--tarjeta:#FFFFFF;--linea:#E5E9F0}
  @media (prefers-color-scheme: dark){:root{--navy:#9FC6F5;--texto:#E5E7EB;--suave:#9CA3AF;--fondo:#0B1220;--tarjeta:#111A2E;--linea:#22304A}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font-family:Manrope,'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .caja{max-width:520px;width:100%;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:32px 26px;text-align:center}
  .marca{font-weight:800;color:var(--navy);letter-spacing:.3px;font-size:15px;margin-bottom:22px}
  h1{font-size:22px;color:var(--navy);margin:0 0 12px;line-height:1.3}
  p{margin:0 0 18px;font-size:15px}
  a.btn{display:inline-block;background:#FF7E00;color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:13px 22px;font-size:15px;word-break:break-all}
  .pie{margin-top:22px;font-size:12.5px;color:var(--suave)}
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">OpenCluster Tech</div>
    <h1>Estamos trabajando en este catálogo</h1>
    <p>Lo estamos actualizando y por ahora no está disponible. Si tienes dudas o necesitas un precio, escríbeme y te respondo.</p>
    <a class="btn" href="mailto:rayen.ogalde@opencluster-tech.cl">rayen.ogalde@opencluster-tech.cl</a>
    <div class="pie">Gracias por tu paciencia.</div>
  </div>
</body>
</html>
