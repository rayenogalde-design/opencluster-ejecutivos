<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas — Ventas | OpenCluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#001A60; --green:#16A34A; --ink:#111; --sub:#6b7280; --border:#e5e7eb; }
  *{ box-sizing:border-box; }
  body{ font-family:'Manrope',sans-serif; margin:0; background:#f4f6fb; color:var(--ink); }
  .top{ background:var(--navy); color:#fff; padding:18px 24px; display:flex; align-items:center; gap:14px; }
  .top a{ color:#cdd7ff; text-decoration:none; font-size:13px; font-weight:500; }
  .top h1{ font-size:18px; font-weight:800; margin:0; }
  .wrap{ max-width:920px; margin:0 auto; padding:24px 18px 60px; }
  .intro{ color:var(--sub); font-size:14px; margin:6px 0 18px; }
  .kpis{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .kpi{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 18px; flex:1; min-width:140px; }
  .kpi .n{ font-size:26px; font-weight:800; color:var(--navy); }
  .kpi .l{ font-size:12px; color:var(--sub); margin-top:2px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .card .hd{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .card .cli{ font-size:17px; font-weight:800; }
  .card .inst{ font-size:13px; color:var(--sub); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px 18px; margin:14px 0; }
  .f .k{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; }
  .f .v{ font-size:14px; font-weight:500; margin-top:1px; }
  .imgs{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .imgs a{ font-size:12.5px; font-weight:700; color:var(--navy); border:1px solid var(--border); border-radius:8px; padding:7px 12px; text-decoration:none; background:#f8faff; }
  .pill{ font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:999px; }
  .row-acc{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .row-acc select{ font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--border); border-radius:8px; }
  .muted{ color:var(--sub); text-align:center; padding:40px 20px; }
  .etq{ background:#FFF5F7; border:1px solid #FBCFE8; border-radius:10px; padding:8px 12px; font-size:12.5px; color:#9D174D; font-weight:700; display:inline-block; margin-top:6px; }
  .filtros{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 18px; margin-bottom:14px; }
  .filtros label{ display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .filtros select{ font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; min-width:180px; background:#fff; color:var(--ink); }
  .resumen{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:6px 0; margin-bottom:18px; overflow-x:auto; }
  .resumen table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .resumen th{ text-align:left; font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; padding:8px 14px; font-weight:700; }
  .resumen td{ padding:8px 14px; border-top:1px solid var(--border); }
  .resumen td.n, .resumen th.n{ text-align:right; white-space:nowrap; }
  .resumen tr.tot td{ font-weight:800; color:var(--navy); }
  .prods{ background:#f8faff; border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:4px 0 10px; }
  .prods .k{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .prods ul{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; }
  .com{ border-radius:10px; padding:9px 14px; font-size:13px; margin:4px 0 10px; font-weight:500; }
  .com.sola{ background:#F0FDF4; border:1px solid #BBF7D0; color:#166534; }
  .com.compartida{ background:#FFF7ED; border:1px solid #FED7AA; color:#9A3412; }
  .montos{ border:1px solid #BFDBFE; background:#EFF6FF; border-radius:10px; padding:9px 14px; margin:4px 0 10px; font-size:13px; color:#001A60; }
  .montos .k{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-bottom:4px; }
  .montos .fila{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .montos .fila b{ white-space:nowrap; }
  .montos .nota{ font-size:11.5px; color:#92400E; font-weight:700; }
  .montos.costos table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .montos.costos th{ text-align:left; font-size:10.5px; color:var(--sub); text-transform:uppercase; padding:4px 6px 4px 0; }
  .montos.costos td{ padding:4px 6px 4px 0; border-top:1px solid #DBEAFE; vertical-align:top; }
  .montos.costos .n{ text-align:right; white-space:nowrap; }
  .montos.costos tr.tot td{ font-weight:800; }
  .montos.pend{ border-style:dashed; background:#fff; color:var(--sub); }
  .tit-res{ font-size:12px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.05em; padding:8px 14px 2px; }
  .aviso-dup{ background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:700; display:inline-block; margin-bottom:8px; }
  @media (max-width:600px){ .filtros select{ min-width:0; width:100%; } .filtros label{ flex:1 1 100%; } }
</style>
</head>
<body>
  <div class="top">
    <a href="index.html">&larr; Central</a>
    <h1>Finanzas — Ventas del equipo de difusión</h1>
  </div>
  <div class="wrap">
    <div class="intro">Cada venta cerrada por un ejecutivo llega aquí con sus comprobantes. Revisa, descarga, y mueve el estado a medida que avanza.</div>
    <div class="filtros">
      <label>Mes<select id="fMes" onchange="pintar()"></select></label>
      <label>Ejecutivo<select id="fEje" onchange="pintar()"></select></label>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n" id="kNuevas">0</div><div class="l">Por confirmar</div></div>
      <div class="kpi"><div class="n" id="kProceso">0</div><div class="l">En proceso</div></div>
      <div class="kpi"><div class="n" id="kEntregadas">0</div><div class="l">Entregadas</div></div>
    </div>
    <div id="resumen"></div>
    <div id="lista"><div class="muted">Cargando ventas…</div></div>
  </div>
<script>
  var CRM_API = 'https://script.google.com/macros/s/AKfycbz3Vscxz-OlTHehsnEqqTD1qfql4xzstgWM81RG79P5IiLTkRvaYTU2sNoWV_QpceeowA/exec';
  var ESTADOS = ['Pago por confirmar','Recibido por Finanzas','Preparación en bodega','Despachado','Entregado'];
  var COLORES = {
    'Pago por confirmar':{bg:'#FEF3C7',c:'#92400E'}, 'Recibido por Finanzas':{bg:'#DBEAFE',c:'#1E40AF'},
    'Preparación en bodega':{bg:'#E0E7FF',c:'#3730A3'}, 'Despachado':{bg:'#CCFBF1',c:'#0F766E'}, 'Entregado':{bg:'#DCFCE7',c:'#166534'}
  };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function clp(n){ n=Number(String(n||'').replace(/[^0-9]/g,'')); return n? '$'+n.toLocaleString('es-CL') : '—'; }
  function fmt(iso){ if(!iso) return '—'; try{ var d=new Date(iso); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } }
  function f(k,v){ return '<div class="f"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  async function cambiarEstado(id, estado, sel){
    var extra = {};
    if(estado === 'Despachado'){
      var t = prompt('Datos de envío / seguimiento (courier y N° de seguimiento) para avisarle al cliente:', '');
      if(t === null){ cargar(); return; }   // canceló
      extra.tracking = t;
    }
    sel.disabled = true;
    try{
      var r = await fetch(CRM_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({accion:'crm_venta_estado', id:id, estado:estado}, extra))});
      var j = await r.json();
      if(!j.ok) throw new Error(j.error||'error');
      if(estado === 'Despachado') alert('Despachado. Le avisamos al ejecutivo con el seguimiento para que contacte al cliente.');
      cargar();
    }catch(e){ alert('No se pudo actualizar: '+e.message); sel.disabled=false; }
  }
  window.cambiarEstado = cambiarEstado;

  function pill(estado){ var c=COLORES[estado]||{bg:'#eee',c:'#555'}; return '<span class="pill" style="background:'+c.bg+';color:'+c.c+';">'+esc(estado)+'</span>'; }

  var VENTAS = [], COTIS = {}, COMS = [];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function num(n){ return Number(String(n==null?'':n).replace(/[^0-9]/g,''))||0; }
  function clpN(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }
  function nombre(e){ return String(e||'').trim().split(/\s+/).slice(0,2).join(' ') || '(sin ejecutivo)'; }
  function mesDe(v){ return String(v.fecha||'').slice(0,7); }
  function mesTxt(m){ var p=m.split('-'); return MESES[Number(p[1])-1]+' '+p[0]; }
  function pnom(e){ return String(e||'').trim().split(/\s+/)[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  // Comisiones cargadas en el CRM (pestaña Comisiones) para un mes ('' = todos) y, si se da, una cotización
  function comsDe(m, numCot){ return COMS.filter(function(x){ return (!m || x.mes===m) && (!numCot || x.num===numCot); }); }
  function pct(x){ x=Number(x)||0; if(x>0 && x<1) x=x*100; return (Math.round(x*10)/10).toString().replace('.',',')+'%'; }

  function llenarFiltros(){
    var meses = {}, ejes = {};
    VENTAS.forEach(function(v){ if(mesDe(v)) meses[mesDe(v)]=1; ejes[nombre(v.ejecutivo)]=1; });
    var hoy = new Date().toISOString().slice(0,7);
    meses[hoy] = 1;
    var fm = document.getElementById('fMes'), fe = document.getElementById('fEje');
    var selM = fm.value || hoy, selE = fe.value || '';
    fm.innerHTML = Object.keys(meses).sort().reverse().map(function(m){ return '<option value="'+m+'"'+(m===selM?' selected':'')+'>'+mesTxt(m).replace(/^./,function(c){return c.toUpperCase();})+'</option>'; }).join('') + '<option value=""'+(selM===''?' selected':'')+'>Todos los meses</option>';
    fe.innerHTML = '<option value="">Todos los ejecutivos</option>' + Object.keys(ejes).sort().map(function(e){ return '<option value="'+esc(e)+'"'+(e===selE?' selected':'')+'>'+esc(e)+'</option>'; }).join('');
  }

  function pintar(){
    var m = document.getElementById('fMes').value, e = document.getElementById('fEje').value;
    var lista = VENTAS.filter(function(v){ return (!m || mesDe(v)===m) && (!e || nombre(v.ejecutivo)===e); });
    render(lista);
    // Resumen por ejecutivo del filtro elegido
    var por = {};
    lista.forEach(function(v){
      var k = nombre(v.ejecutivo), c = COTIS[v.num] || {};
      por[k] = por[k] || { n:0, rec:0, neto:0, comp:0 };
      por[k].n++; por[k].rec += num(v.monto_recibido); por[k].neto += netoVenta(v);
      if(v.licitacion) por[k].comp++;
    });
    var ks = Object.keys(por).sort();
    var box = document.getElementById('resumen');
    if(!ks.length){ box.innerHTML=''; return; }
    var t = { n:0, rec:0, neto:0, comp:0 };
    var filas = ks.map(function(k){ var p=por[k]; t.n+=p.n; t.rec+=p.rec; t.neto+=p.neto; t.comp+=p.comp;
      return '<tr><td>'+esc(k)+'</td><td class="n">'+p.n+'</td><td class="n">'+p.comp+'</td><td class="n">'+clpN(p.neto)+'</td><td class="n">'+clpN(p.rec)+'</td></tr>'; }).join('');
    box.innerHTML = '<div class="resumen"><table><thead><tr><th>Ejecutivo</th><th class="n">Ventas</th><th class="n">Comisión compartida</th><th class="n">Neto productos pagado</th><th class="n">Monto recibido (c/IVA)</th></tr></thead><tbody>'+filas+
      (ks.length>1?'<tr class="tot"><td>Total</td><td class="n">'+t.n+'</td><td class="n">'+t.comp+'</td><td class="n">'+clpN(t.neto)+'</td><td class="n">'+clpN(t.rec)+'</td></tr>':'')+'</tbody></table></div>' +
      resumenComisiones(m, e);
  }
  // Total de comisiones por persona del mes elegido (incluye a Hernán y los ajustes de meses anteriores)
  function resumenComisiones(m, e){
    var rows = comsDe(m).filter(function(x){ return !e || pnom(x.ejecutivo)===pnom(e); });
    var tit = '<div class="tit-res">Comisiones'+(m?' de '+mesTxt(m):'')+'</div>';
    if(!rows.length) return '<div class="resumen">'+tit+'<div style="padding:8px 14px;font-size:13px;color:var(--sub);">Por calcular.</div></div>';
    var por = {};
    rows.forEach(function(x){ var k=x.ejecutivo||'(sin nombre)'; por[k]=por[k]||{n:0,c:0}; por[k].n++; por[k].c+=Number(x.comision)||0; });
    var ks = Object.keys(por).sort(), tot = 0;
    var filas = ks.map(function(k){ tot += por[k].c; return '<tr><td>'+esc(k)+'</td><td class="n">'+por[k].n+'</td><td class="n"><b>'+clpN(por[k].c)+'</b></td></tr>'; }).join('');
    return '<div class="resumen">'+tit+'<table><thead><tr><th>Persona</th><th class="n">Ítems</th><th class="n">Comisión</th></tr></thead><tbody>'+filas+
      (ks.length>1?'<tr class="tot"><td>Total a pagar</td><td class="n"></td><td class="n">'+clpN(tot)+'</td></tr>':'')+'</tbody></table></div>';
  }
  window.pintar = pintar;

  // Neto de productos que corresponde a ESTE pago (si la venta se paga en partes, solo la fracción pagada)
  function netoVenta(v){
    var c = COTIS[v.num]; if(!c || !c.neto) return 0;
    var p = c.pagos_info, n = num(c.neto);
    if(p && !p.completa && p.total_venta) return n * num(p.pagado) / num(p.total_venta);
    return n;
  }
  // ¿Lo recibido calza con la cotización? (diferencia de más de 2%: p. ej. la OC de la licitación fue por otro monto)
  function noCalza(v){
    var c = COTIS[v.num]; if(!c || !c.neto) return false;
    var p = c.pagos_info, esperado = p && !p.completa ? num(p.pagado) : (num(c.neto) + num(c.transporte)) * 1.19;
    var rec = num(v.monto_recibido);
    return esperado > 0 && rec > 0 && Math.abs(rec - esperado) / esperado > 0.02;
  }
  function bloqueProductos(v){
    var c = COTIS[v.num]; if(!c || !c.productos) return '';
    var items = String(c.productos).match(/[^,\s][\s\S]*?x\s?\d+(?=\s*,|\s*$)/g) || [String(c.productos)];
    return '<div class="prods"><div class="k">Productos de la cotización</div><ul>'+items.map(function(p){ return '<li>'+esc(p.trim())+'</li>'; }).join('')+'</ul></div>';
  }
  function bloqueComision(v){
    if(v.licitacion){
      var otro = String(v.licitador||'').trim();
      var esElMismo = otro && nombre(otro)===nombre(v.ejecutivo);
      return '<div class="com compartida"><b>Venta por licitación.</b> '+esc(nombre(v.ejecutivo))+' recibe el '+pct(v.pct_licitacion)+' de comisión'+
        (otro && !esElMismo ? ' · la comparte con <b>'+esc(otro)+'</b> (equipo de licitaciones)' : ' · no la comparte')+'.</div>';
    }
    return '<div class="com sola">Comisión no compartida: va completa a '+esc(nombre(v.ejecutivo))+'.</div>';
  }
  // Costos de compra que declaró el ejecutivo (ventas por licitación) y el margen que resulta
  function bloqueCostosLicit(v){
    var L = v.costos_licitacion || []; if(!L.length) return '';
    var tot = 0;
    var filas = L.map(function(x){ var t = (Number(x.costo_unit)||0) * (Number(x.cantidad)||0); tot += t;
      return '<tr><td>'+esc(x.producto)+(x.proveedor?'<div class="nota">'+esc(x.proveedor)+'</div>':'')+'</td><td class="n">'+(x.cantidad||0)+'</td><td class="n">'+clpN(x.costo_unit)+'</td><td class="n">'+clpN(t)+'</td></tr>'; }).join('');
    var c = COTIS[v.num], neto = c && c.neto ? num(c.neto) : 0;
    return '<div class="montos costos"><div class="k">Costos de compra declarados por '+esc(nombre(v.ejecutivo))+'</div>'+
      '<table><thead><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Costo neto c/u</th><th class="n">Total</th></tr></thead><tbody>'+filas+
      '<tr class="tot"><td colspan="3">Costo total</td><td class="n">'+clpN(tot)+'</td></tr>'+
      (neto?'<tr class="tot"><td colspan="3">Margen (neto productos '+clpN(neto)+' − costo)</td><td class="n">'+clpN(neto-tot)+'</td></tr>':'')+
      '</tbody></table></div>';
  }
  // Montos de comisión de ESTA venta en el mes elegido
  function bloqueMontos(v){
    var m = document.getElementById('fMes').value;
    var rows = comsDe(m || mesDe(v), v.num);
    if(!rows.length) return '<div class="montos pend">Monto de comisión: por calcular.</div>';
    return '<div class="montos"><div class="k">Comisión de esta venta</div>' + rows.map(function(x){
      return '<div class="fila"><span>'+esc(x.ejecutivo)+(x.pct?' · '+pct(x.pct):' · monto fijo')+'</span><b>'+clpN(x.comision)+'</b></div>'+
        (x.nota?'<div class="nota">'+esc(x.nota)+'</div>':'');
    }).join('') + '</div>' + bloqueGanancia(v, rows);
  }
  // Ganancia del mes en esta venta (Rayen, 27-oct-2026): margen del mes menos todas sus comisiones.
  // Venta, costo y margen salen de la fila del ejecutivo de la venta (en pagos parciales, ya vienen
  // en la proporción pagada ese mes).
  function bloqueGanancia(v, rows){
    var base = rows.filter(function(x){ return pnom(x.ejecutivo) === pnom(v.ejecutivo); })[0] ||
      rows.slice().sort(function(a,b){ return (Number(b.margen_neto)||0) - (Number(a.margen_neto)||0); })[0];
    var margen = Number(base && base.margen_neto) || 0;
    if(!margen) return '';
    var coms = rows.reduce(function(s,x){ return s + (Number(x.comision)||0); }, 0);
    var gan = margen - coms;
    return '<div class="montos costos"><div class="k">Ganancia de esta venta en el mes</div>' +
      (base.venta_neta ? '<div class="fila"><span>Venta neta</span><b>'+clpN(base.venta_neta)+'</b></div>' : '') +
      (base.costo_neto ? '<div class="fila"><span>Costo</span><b>'+clpN(base.costo_neto)+'</b></div>' : '') +
      (function(){
        // Pago parcial: venta y costo son de la venta completa; el margen es solo la parte de este mes.
        var total = (Number(base.venta_neta)||0) - (Number(base.costo_neto)||0);
        if(base.venta_neta && base.costo_neto && total > 0 && Math.abs(total - margen) > 1)
          return '<div class="fila"><span>Margen de la venta completa</span><b>'+clpN(total)+'</b></div>' +
                 '<div class="fila"><span>Margen de este mes ('+pct(margen/total)+' de la venta)</span><b>'+clpN(margen)+'</b></div>';
        return '<div class="fila"><span>Margen</span><b>'+clpN(margen)+'</b></div>';
      })() +
      '<div class="fila"><span>Comisiones</span><b>−'+clpN(coms)+'</b></div>' +
      '<div class="fila" style="border-top:1px solid #d1d5db;margin-top:4px;padding-top:4px;"><span><b>Ganancia</b></span><b style="color:'+(gan<0?'#B91C1C':'#047857')+';">'+(gan<0?'−':'')+clpN(Math.abs(gan))+'</b></div>' +
    '</div>';
  }
  function bloquePago(v){
    var c = COTIS[v.num]; if(!c || !c.pagos_info) return '';
    var p = c.pagos_info;
    return f('Pago', p.completa ? 'Completo' : 'Parcial: '+clpN(p.pagado)+' de '+clpN(p.total_venta)+' · saldo '+clpN(p.saldo));
  }

  function render(ventas){
    var dup = {}; ventas.forEach(function(v){ dup[v.num]=(dup[v.num]||0)+1; });
    document.getElementById('kNuevas').textContent = ventas.filter(function(v){return v.estado==='Pago por confirmar';}).length;
    document.getElementById('kProceso').textContent = ventas.filter(function(v){return ['Recibido por Finanzas','Preparación en bodega','Despachado'].indexOf(v.estado)>=0;}).length;
    document.getElementById('kEntregadas').textContent = ventas.filter(function(v){return v.estado==='Entregado';}).length;
    var cont = document.getElementById('lista');
    if(!ventas.length){ cont.innerHTML = '<div class="muted">No hay ventas para este filtro.</div>'; return; }
    cont.innerHTML = ventas.map(function(v){
      var opts = ESTADOS.map(function(e){ return '<option value="'+esc(e)+'"'+(e===v.estado?' selected':'')+'>'+esc(e)+'</option>'; }).join('');
      var imgs = '';
      if(v.url_oc) imgs += '<a href="'+esc(v.url_oc)+'" target="_blank">Ver orden de compra</a>';
      if(v.url_transferencia) imgs += '<a href="'+esc(v.url_transferencia)+'" target="_blank">Ver transferencia</a>';
      if(v.url_cotizacion) imgs += '<a href="'+esc(v.url_cotizacion)+'" target="_blank">Ver cotización (PDF)</a>';
      (v.etiqueta_urls||[]).forEach(function(u,ix){ imgs += '<a href="'+esc(u)+'" target="_blank">Ver etiqueta '+(ix+1)+'</a>'; });
      return '<div class="card">' +
        (dup[v.num]>1?'<div class="aviso-dup">Esta cotización está informada '+dup[v.num]+' veces</div>':'') +
        '<div class="hd"><div><div class="cli">'+esc(v.cliente||v.institucion||'(sin nombre)')+'</div>'+(v.institucion&&v.cliente?'<div class="inst">'+esc(v.institucion)+'</div>':'')+'</div>'+pill(v.estado)+'</div>' +
        '<div class="grid">' +
          f('Cotización N°', esc(v.num||'—')) + f('Ejecutivo', esc(String(v.ejecutivo||'').split(' ')[0])) +
          f('Monto recibido', clp(v.monto_recibido)) + f('Documento', esc(v.documento||'—')) +
          f('Forma de envío', esc(v.forma_envio||'—')) + f('Monto cotizado por envío', clp(v.costo_envio)) +
          f('Fecha', fmt(v.fecha)) +
          (COTIS[v.num] && COTIS[v.num].neto ? f('Neto productos (cotización)', clpN(num(COTIS[v.num].neto))) : '') +
          bloquePago(v) +
        '</div>' +
        (noCalza(v)?'<div class="aviso-dup">El monto recibido no calza con la cotización: revisar la orden de compra</div>':'') +
        bloqueComision(v) +
        bloqueCostosLicit(v) +
        bloqueMontos(v) +
        bloqueProductos(v) +
        '<div class="f"><div class="k">Dirección de despacho</div><div class="v">'+esc(v.direccion_despacho||'—')+'</div></div>' +
        (imgs?'<div class="imgs">'+imgs+'</div>':'') +
        (v.solicita_etiquetas==='Sí'?'<div class="etq">Pidió etiquetas a Ximena ('+esc(v.estado_etiqueta||'Pendiente')+')</div>':'') +
        (v.tracking?'<div class="f" style="margin-top:6px;"><div class="k">Datos de envío / seguimiento</div><div class="v">'+esc(v.tracking)+'</div></div>':'') +
        '<div class="row-acc"><span style="font-size:12px;color:#6b7280;">Estado:</span><select onchange="cambiarEstado(\''+esc(v.id)+'\',this.value,this)">'+opts+'</select></div>' +
      '</div>';
    }).join('');
  }

  // Los costos de licitación solo llegan con la clave de la vista de administradora de Rayen
  // (la misma de «Mis costos y márgenes», guardada en este navegador). Sin clave, la página
  // muestra todo lo demás y un botón para escribirla.
  var K_CLAVE = 'oct_clave_MisCostosYMargenes_PRIVADA.html';
  function claveAdm(){ try { return localStorage.getItem(K_CLAVE) || ''; } catch(e){ return ''; } }
  function pedirClave(){
    var c = prompt('Escribe tu clave de la vista de administradora para ver los costos:');
    if(!c) return;
    try { localStorage.setItem(K_CLAVE, c.trim()); } catch(e){}
    cargar();
  }
  window.pedirClave = pedirClave;
  function avisoClave(ok){
    var b = document.getElementById('avisoClave');
    if(!b){ b = document.createElement('div'); b.id = 'avisoClave'; var l = document.getElementById('lista'); l.parentNode.insertBefore(b, l); }
    b.innerHTML = ok ? '' : '<div style="margin:0 0 12px;font-size:13px;color:#6b7280;">Los costos de licitación están ocultos. <button onclick="pedirClave()" style="background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:5px 11px;font-weight:700;cursor:pointer;font-family:inherit;">Ver costos</button></div>';
  }
  function cargar(){
    var pV = fetch(CRM_API + '?accion=crm_ventas_finanzas&clave=' + encodeURIComponent(claveAdm())).then(function(r){ return r.json(); });
    // Productos, neto y pagos de cada cotización (si falla, la página igual muestra las ventas)
    var pC = fetch(CRM_API + '?accion=crm_mis_cotizaciones&solicitante=' + encodeURIComponent('Rayen Ogalde'))
      .then(function(r){ return r.json(); }).catch(function(){ return {}; });
    var pK = fetch(CRM_API + '?accion=crm_mis_comisiones&solicitante=' + encodeURIComponent('Rayen Ogalde'))
      .then(function(r){ return r.json(); }).catch(function(){ return {}; });
    Promise.all([pV, pC, pK])
      .then(function(res){
        if(!res[0].ok) throw new Error(res[0].error||'error');
        VENTAS = res[0].ventas || [];
        avisoClave(res[0].costos_ok !== false);
        COTIS = {};
        ((res[1] && res[1].cotizaciones) || []).forEach(function(c){ if(c.cotizacion) COTIS[c.cotizacion] = c; });
        COMS = (res[2] && res[2].comisiones) || [];
        llenarFiltros(); pintar();
      })
      .catch(function(e){ document.getElementById('lista').innerHTML = '<div class="muted">No se pudo cargar ('+e.message+').</div>'; });
  }
  cargar();
</script>
</body>
</html>
