function clp(n){ return (n==null||isNaN(n)) ? null : '$' + Number(Math.round(n)).toLocaleString('es-CL'); }
function pct(n){ return (n==null||isNaN(n)) ? null : (Number(n)*100).toFixed(1).replace('.',',') + '%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function normal(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

let activeFam = null, activeIdx = {};

function pintaCard(o, i){
  const opciones = [o].concat(o.alternativas || []);
  const sel = activeIdx[i] || 0;
  const d = opciones[sel];
  const card = document.createElement('div'); card.className = 'card';
  let h = '<div class="c-top">';
  h += o.img ? '<img class="c-thumb" src="' + esc(o.img) + '" alt="" loading="lazy" data-big="' + esc(o.img) + '" onerror="this.style.visibility=\'hidden\'">'
             : '<div class="c-ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg></div>';
  h += '<div class="c-info"><div class="c-name" title="' + esc(o.nombre) + '">' + esc(o.nombre) + '</div><div class="c-meta">'
     + '<span class="c-code">' + esc(o.codigo) + '</span>'
     + (o.marca ? '<span class="c-brand">' + esc(o.marca) + '</span>' : '')
     + '</div></div></div>';
  const prov = d.proveedor || o.proveedor;
  const sku = d.sku || o.sku;
  h += '<div class="c-prov" title="' + esc((prov||'') + ' ' + (sku||'')) + '">'
     + (prov ? 'Pedir a <b>' + esc(prov) + '</b>' : '')
     + (sku ? ' <span class="sk">· ' + esc(sku) + '</span>' : '') + '</div>';

  h += '<div class="costos"><div><span class="k">Costo neto</span><span class="v">' + (clp(d.costoNeto) || '—') + '</span></div>'
     + '<div><span class="k">Costo c/IVA</span><span class="v">' + (clp(d.costoIva) || '—') + '</span></div></div>';

  h += '<table class="listas"><tr><th>Lista</th><th>Venta c/IVA</th><th>Margen</th><th>Gano</th></tr>';
  LISTAS.forEach(function(L){
    const x = d[L[0]] || {};
    const bajo = (x.mp != null && x.mp < 0.15);
    h += '<tr><td>' + esc(L[1]) + '</td><td class="venta">' + (clp(x.v) || '—') + '</td>'
       + '<td class="' + (bajo ? 'mg-bajo' : 'mg-ok') + '">' + (pct(x.mp) || '—') + '</td>'
       + '<td>' + (clp(x.mm) || '—') + '</td></tr>';
  });
  h += '</table>';

  if (opciones.length > 1) {
    h += '<div class="provs">';
    opciones.forEach(function(op, k){
      h += '<button class="prov-btn' + (k === sel ? ' on' : '') + '" data-i="' + i + '" data-k="' + k + '">'
         + (k === 0 ? 'más barato' : esc(op.proveedor || 'otra opción')) + '</button>';
    });
    h += '</div>';
  }
  card.innerHTML = h;
  card.querySelectorAll('.prov-btn').forEach(function(b){
    b.addEventListener('click', function(){ activeIdx[b.dataset.i] = Number(b.dataset.k); render(); });
  });
  const im = card.querySelector('.c-thumb');
  if (im) im.addEventListener('click', function(){ document.getElementById('lbimg').src = im.dataset.big; document.getElementById('lb').classList.add('open'); });
  return card;
}

function coincide(o, q){
  if (!q) return true;
  const t = normal(o.nombre + ' ' + (o.marca||'') + ' ' + (o.proveedor||'') + ' ' + (o.codigo||'') + ' ' + (o.sku||'') + ' ' + (FAMILIAS[o.familiaKey]||''));
  return q.split(/\s+/).every(function(w){ return t.indexOf(w) >= 0; });
}

function render(){
  const q = normal(document.getElementById('q').value.trim());
  let lista = DATA.filter(function(o, i){ o._i = i; return (!activeFam || o.familiaKey === activeFam) && coincide(o, q); });
  const ord = document.getElementById('ord').value;
  function mg(o){ return (o.rob && o.rob.mp != null) ? o.rob.mp : 9; }
  if (ord === 'mg-menor') lista = lista.slice().sort(function(a,b){ return mg(a) - mg(b); });
  else if (ord === 'mg-mayor') lista = lista.slice().sort(function(a,b){ return mg(b) - mg(a); });
  else if (ord === 'costo-mayor') lista = lista.slice().sort(function(a,b){ return (b.costoNeto||0) - (a.costoNeto||0); });
  else if (ord === 'costo-menor') lista = lista.slice().sort(function(a,b){ return (a.costoNeto||0) - (b.costoNeto||0); });
  const res = document.getElementById('res'); res.innerHTML = '';
  document.getElementById('cnt').textContent = lista.length + ' de ' + DATA.length + ' productos';
  if (!lista.length) { res.innerHTML = '<div class="empty">No encontré nada con eso.</div>'; return; }
  const frag = document.createDocumentFragment();
  lista.slice(0, 300).forEach(function(o){ frag.appendChild(pintaCard(o, o._i)); });
  res.appendChild(frag);
  if (lista.length > 300) {
    const m = document.createElement('div'); m.className = 'empty';
    m.textContent = 'Muestro los primeros 300. Escribe en el buscador o elige una familia para acotar.';
    res.appendChild(m);
  }
}

function pintaChips(){
  const cuenta = {};
  DATA.forEach(function(o){ cuenta[o.familiaKey] = (cuenta[o.familiaKey]||0) + 1; });
  const c = document.getElementById('chips');
  const todas = document.createElement('button'); todas.className = 'chip active';
  todas.innerHTML = 'Todas<span class="n">' + DATA.length + '</span>';
  todas.addEventListener('click', function(){ activeFam = null; marca(todas); render(); });
  c.appendChild(todas);
  Object.keys(FAMILIAS).forEach(function(k){
    if (!cuenta[k]) return;
    const b = document.createElement('button'); b.className = 'chip';
    b.innerHTML = esc(FAMILIAS[k]) + '<span class="n">' + cuenta[k] + '</span>';
    b.addEventListener('click', function(){ activeFam = k; marca(b); render(); });
    c.appendChild(b);
  });
  function marca(el){ c.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); }); el.classList.add('active'); }
}

document.querySelector('.sub-count').textContent = DATA.length.toLocaleString('es-CL') + ' productos';
document.getElementById('lb').addEventListener('click', function(){ this.classList.remove('open'); });
pintaChips();
document.getElementById('q').addEventListener('input', render);
document.getElementById('ord').addEventListener('change', render);
render();
</script>
