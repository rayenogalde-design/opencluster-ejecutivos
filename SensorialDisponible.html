<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala multisensorial · Productos disponibles</title>
<link rel="icon" href="isotipo-oct.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#001A60; --sky:#06B3FD; --naranja:#FF7E00;
  --texto:#1F2937; --suave:#6B7280; --linea:#E5E9F0;
  --fondo:#FAFBFC; --hover:#ECF6FF; --blanco:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif; background:var(--fondo); color:var(--texto);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* ── Cabecera ─────────────────────────────────────────────── */
header{background:var(--blanco);border-bottom:1px solid var(--linea)}
.cab{display:flex;align-items:flex-start;gap:24px;padding:26px 0 22px;flex-wrap:wrap}
.cab img{height:38px;width:auto;flex:none}
.cab-txt{flex:1;min-width:260px}
h1{font-size:23px;font-weight:800;color:var(--navy);margin:0 0 4px;letter-spacing:-.01em}
.bajada{margin:0;color:var(--suave);font-size:13.5px;max-width:640px}
.cifras{display:flex;gap:26px;flex:none;padding-top:3px}
.cifra b{display:block;font-size:22px;font-weight:800;color:var(--navy);line-height:1.1}
.cifra span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);font-weight:500}

/* ── Barra de filtros ─────────────────────────────────────── */
.barra{background:var(--blanco);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20}
.barra-in{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.buscador{position:relative;flex:1;min-width:220px;max-width:340px}
.buscador svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--suave)}
.buscador input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--linea);border-radius:999px;
  font-family:inherit;font-size:13px;color:var(--texto);background:var(--fondo);outline:none;
}
.buscador input:focus{border-color:var(--sky);background:var(--blanco)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--linea);background:var(--blanco);color:var(--suave);
  padding:6px 13px;border-radius:999px;font-family:inherit;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover{background:var(--hover);border-color:#CBE4F7}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.conteo{font-size:12px;color:var(--suave);margin-left:auto;white-space:nowrap}

/* ── Las 3 salas ──────────────────────────────────────────── */
#salas{padding-top:28px}
.salas-cab{margin-bottom:16px}
.salas-cab .rot{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-bottom:3px}
.salas-cab h2{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 4px}
.salas-cab p{margin:0;font-size:13px;color:var(--suave);max-width:640px}
.salas-grilla{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sala{
  background:var(--blanco);border:1px solid var(--linea);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;
}
.sala:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,26,96,.09)}
.sala-cab{
  background:linear-gradient(170deg,#0A0F1E,#001a60 35%,#0A2E8A 60%,#06b3fd);
  border-bottom:3px solid var(--naranja);padding:16px 18px;color:#fff;
}
.sala-cab h3{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.2}
.sala-cab .para{font-size:11.5px;opacity:.88;line-height:1.4}
.sala-cuerpo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:13px;flex:1}
.sala-txt{margin:0;font-size:12.8px;line-height:1.62;color:var(--texto)}
.sala-bloque .et{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin-bottom:5px}
.sala-chips{display:flex;flex-wrap:wrap;gap:5px}
.sala-chips span{border:1px solid #CBE4F7;background:#F4F9FF;color:#042C53;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600}
.sala-chips.perfil span{border-color:var(--linea);background:var(--fondo);color:#334155;font-weight:400}
.sala-nota{font-size:11.5px;color:var(--suave);font-style:italic}
.sala-ver{
  background:none;border:0;padding:0;color:var(--sky);font-family:inherit;font-size:12px;
  font-weight:700;cursor:pointer;text-align:left;
}
.sala-items{display:none;flex-direction:column;gap:2px}
.sala-items.abierto{display:flex}
.sala-items div{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0;border-bottom:1px dotted var(--linea)}
.sala-items span:last-child{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.sala-total{
  margin-top:auto;padding:12px 14px;background:var(--fondo);border:1px solid var(--linea);border-radius:12px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.sala-total .lab{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.sala-total .num{font-size:19px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.sala-total .iva{display:block;font-size:9.5px;color:var(--suave);text-align:right;font-weight:500}

/* ── Secciones y grilla ───────────────────────────────────── */
main{padding:28px 0 60px}
.seccion{margin-bottom:34px}
.seccion-cab{border-top:1px solid var(--linea);padding-top:14px;margin-bottom:14px}
.seccion h2{font-size:12px;font-weight:700;color:var(--navy);margin:0;text-transform:uppercase;letter-spacing:.08em}
.seccion p{margin:3px 0 0;font-size:12.5px;color:var(--suave)}
.grilla{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.tarjeta{
  background:var(--blanco);border:1px solid var(--linea);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;text-align:left;font-family:inherit;padding:0;
}
.tarjeta:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,26,96,.08);border-color:#CBE4F7}
.foto{
  aspect-ratio:5/4;background:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-bottom:1px solid var(--linea);position:relative;
}
.foto img{width:100%;height:100%;object-fit:contain;padding:8px}
.sinfoto{color:#C3CEDD;font-size:11px;font-weight:500;letter-spacing:.04em}
.t-cuerpo{padding:11px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.t-nombre{
  font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.3;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px;
}
.t-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--suave);font-weight:500}
.t-oc{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.t-pie{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.t-precio b{display:block;font-size:15px;font-weight:800;color:var(--texto);font-variant-numeric:tabular-nums;line-height:1.2}
.t-precio span{font-size:9.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.stock{
  background:#E1F5EE;color:#04342C;border-radius:999px;padding:3px 9px;
  font-size:10.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.sinprecio{font-size:11.5px;color:var(--suave);font-weight:500}
.pendiente{
  position:absolute;top:8px;left:8px;background:#FAEEDA;color:#412402;
  font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;
}
.vacio{text-align:center;padding:70px 20px;color:var(--suave)}

/* ── Ficha ────────────────────────────────────────────────── */
.velo{
  position:fixed;inset:0;background:rgba(10,15,30,.58);z-index:50;
  display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;
}
.velo.abierto{display:flex}
.ficha{
  background:var(--blanco);border-radius:16px;max-width:880px;width:100%;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,26,96,.22);animation:sube .2s ease-out;
}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.f-cab{
  background:var(--navy);color:#fff;padding:20px 26px;display:flex;align-items:center;
  gap:16px;border-bottom:3px solid var(--naranja);
}
.f-cab h3{margin:0;font-size:18px;font-weight:800;flex:1;line-height:1.25}
.f-cab .f-oc{font-size:11px;opacity:.72;font-weight:500;letter-spacing:.04em;margin-top:2px}
.cerrar{
  background:rgba(255,255,255,.14);border:0;color:#fff;width:32px;height:32px;border-radius:999px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s;
}
.cerrar:hover{background:rgba(255,255,255,.26)}
.f-cuerpo{padding:22px 26px 28px;max-height:calc(100vh - 170px);overflow-y:auto}
.f-alto{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-bottom:22px}
.f-fotos{display:flex;flex-direction:column;gap:8px}
.f-foto{
  aspect-ratio:4/3;background:#fff;border:1px solid var(--linea);border-radius:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.f-foto img{width:100%;height:100%;object-fit:contain;padding:8px}
.f-mini{display:flex;gap:6px;flex-wrap:wrap}
.f-mini button{
  width:52px;height:44px;flex:none;border:1px solid var(--linea);border-radius:8px;background:#fff;
  overflow:hidden;cursor:pointer;padding:2px;transition:border-color .15s;
}
.f-mini button[aria-pressed="true"]{border-color:var(--sky)}
.f-mini img{width:100%;height:100%;object-fit:contain}
.f-datos{display:flex;flex-direction:column;gap:14px}
.f-precio{border:1px solid var(--linea);border-radius:12px;padding:14px 16px;background:var(--fondo)}
.f-precio .grande{font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.f-precio .chico{font-size:12px;color:var(--suave);margin-top:3px;font-variant-numeric:tabular-nums}
.f-tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{background:var(--hover);color:#042C53;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700}
.tag.verde{background:#E1F5EE;color:#04342C}
.tag.aviso{background:#FAEEDA;color:#412402}
/* «qué estimula» va dentro del párrafo, en el mismo tamaño, solo en navy */
.estim{color:var(--navy);font-weight:700}

/* ── Materiales: lo que el papel acredita ─────────────────── */
.mat{margin-top:16px;border:1px solid #A9DCC9;border-radius:12px;overflow:hidden;background:#F2FBF8}
.mat-cab{background:#E1F5EE;padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #C5E8DC}
.mat-cab svg{flex:none;color:#04342C}
.mat-cab b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#04342C}
.mat-sellos{display:flex;flex-wrap:wrap;gap:6px;padding:13px 14px 5px}
.mat-sellos span{background:var(--blanco);border:1px solid #A9DCC9;color:#04342C;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:700}
.mat-detalle{padding:11px 14px 14px;font-size:12px;line-height:1.6;color:#2F4F46}
.mat-detalle div{margin-bottom:3px}
.mat-detalle b{color:#04342C;font-weight:700}
/* en la tarjeta, un sello chico que avisa que tiene respaldo */
.sello-mini{
  position:absolute;bottom:8px;right:8px;background:#E1F5EE;color:#04342C;border:1px solid #A9DCC9;
  border-radius:999px;padding:3px 9px;font-size:9.5px;font-weight:700;letter-spacing:.02em;
}
.destacado{border-left:3px solid var(--sky);padding:2px 0 2px 13px;font-size:13.5px;color:var(--texto)}
.destacado b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--sky);font-weight:700;margin-bottom:2px}
.bloque{margin-bottom:18px}
.bloque h4{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);font-weight:700;
  margin:0 0 7px;padding-top:11px;border-top:1px solid var(--linea);
}
.bloque p{margin:0;font-size:13.5px;line-height:1.62}
.lista{display:flex;flex-wrap:wrap;gap:6px}
.lista span{background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:4px 10px;font-size:12px}
.tecnica{background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:13px 15px;font-size:12.5px;line-height:1.65}
.nota{font-size:12px;color:var(--suave);font-style:italic}

footer{border-top:1px solid var(--linea);background:var(--blanco);padding:22px 0;text-align:center;color:var(--suave);font-size:12px}

@media(max-width:900px){
  .grilla{grid-template-columns:repeat(2,1fr)}
  .f-alto{grid-template-columns:1fr}
  .cifras{width:100%;gap:22px}
}
@media(max-width:560px){
  .grilla{grid-template-columns:1fr}
  .cab{gap:14px}
  h1{font-size:19px}
  .f-cuerpo{padding:18px}
  .f-cab{padding:16px 18px}
}
@media print{
  .barra,footer,.cerrar{display:none}
  .tarjeta{break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="wrap cab">
    <img src="oct-logo-horiz.png" alt="OpenCluster Technologies" onerror="this.style.display='none'">
    <div class="cab-txt">
      <h1>Sala multisensorial · productos disponibles</h1>
      <p class="bajada">Qué es cada equipo, para qué sirve, para quién está indicado y cuánto vale.
        Todo lo que aparece aquí está en bodega y se puede entregar.</p>
    </div>
    <div class="cifras">
      <div class="cifra"><b id="nProd">—</b><span>productos</span></div>
    </div>
  </div>
</header>

<div class="barra">
  <div class="wrap barra-in">
    <div class="buscador">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar un producto…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="conteo" id="conteo"></div>
  </div>
</div>

<section class="wrap" id="salas"></section>

<main class="wrap" id="lista"></main>

<footer>OpenCluster Technologies · Construyendo Inclusión · www.opencluster-tech.cl</footer>

<div class="velo" id="velo">
  <div class="ficha" role="dialog" aria-modal="true">
    <div class="f-cab">
      <div style="flex:1">
        <h3 id="fNombre"></h3>
        <div class="f-oc" id="fOc"></div>
      </div>
      <button class="cerrar" onclick="cerrar()" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="f-cuerpo" id="fCuerpo"></div>
  </div>
</div>

<script src="SensorialBodega.js"></script>
<script src="SensorialSalas.js"></script>
<script>
(function(){
  var P = window.SENSORIAL_BODEGA || [], CATS = window.SENSORIAL_CATS || [];
  var SALAS = window.SENSORIAL_SALAS || [];
  var filtro = 0, texto = '';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pesos(n){ return '$' + Number(n||0).toLocaleString('es-CL'); }
  function normal(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

  /* ── Las 3 salas, antes de los productos ─────────────── */
  function chipsDe(txt, clase){
    var p = String(txt||'').split('·').map(function(x){ return x.trim(); }).filter(Boolean);
    if(!p.length) return '';
    return '<div class="sala-chips'+(clase?' '+clase:'')+'">' +
      p.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('') + '</div>';
  }
  if(SALAS.length){
    document.getElementById('salas').innerHTML =
      '<div class="salas-cab"><div class="rot">Tres formas de armarla</div>' +
      '<h2>Nuestras salas</h2>' +
      '<p>Cada una responde a una necesidad distinta y tiene un valor cerrado. ' +
      'Todos sus productos están en bodega y más abajo aparece la ficha de cada uno.</p></div>' +
      '<div class="salas-grilla">' + SALAS.map(function(s,k){
        return '<div class="sala">' +
          '<div class="sala-cab"><h3>'+esc(s.n)+'</h3><div class="para">'+esc(s.para)+'</div></div>' +
          '<div class="sala-cuerpo">' +
            '<p class="sala-txt">'+esc(s.txt)+'</p>' +
            (s.foco ? '<div class="sala-bloque"><div class="et">En qué está enfocada</div>'+chipsDe(s.foco)+'</div>' : '') +
            (s.quien ? '<div class="sala-bloque"><div class="et">A quién puede ayudar</div>'+chipsDe(s.quien,'perfil')+'</div>' : '') +
            (s.nota ? '<div class="sala-nota">'+esc(s.nota)+'</div>' : '') +
            '<button class="sala-ver" data-sala="'+k+'">Ver los '+s.items.length+' productos</button>' +
            '<div class="sala-items" id="salaitems'+k+'">' + s.items.map(function(i){
              return '<div><span>'+(i.cant>1?i.cant+'× ':'')+esc(i.n)+'</span><span>'+pesos(i.iva*i.cant)+'</span></div>'; }).join('') +
            '</div>' +
            '<div class="sala-total"><span class="lab">Valor de la sala</span>' +
              '<span><span class="num">'+pesos(s.total)+'</span><span class="iva">IVA incluido</span></span></div>' +
          '</div></div>';
      }).join('') + '</div>';
    document.getElementById('salas').addEventListener('click', function(e){
      var b = e.target.closest('.sala-ver'); if(!b) return;
      var caja = document.getElementById('salaitems'+b.dataset.sala);
      var abierto = caja.classList.toggle('abierto');
      b.textContent = abierto ? 'Ocultar los productos' : 'Ver los '+SALAS[b.dataset.sala].items.length+' productos';
    });
  }

  /* ── Filtros ─────────────────────────────────────────── */
  var chips = document.getElementById('chips');
  chips.innerHTML = '<button class="chip" data-c="0" aria-pressed="true">Todos</button>' +
    CATS.map(function(c){ return '<button class="chip" data-c="'+c.id+'" aria-pressed="false">'+esc(c.n)+'</button>'; }).join('');
  chips.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    filtro = Number(b.dataset.c);
    [].forEach.call(chips.children, function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
    pintar();
  });
  document.getElementById('q').addEventListener('input', function(e){ texto = normal(e.target.value); pintar(); });

  /* ── Grilla ──────────────────────────────────────────── */
  function calza(p){
    if(filtro && p.cat !== filtro) return false;
    if(!texto) return true;
    return normal([p.n, p.oc, p.que, p.ind, p.car, p.trab].join(' ')).indexOf(texto) >= 0;
  }
  function tarjeta(p, i){
    var foto = p.img
      ? '<img src="'+esc(p.img)+'" alt="'+esc(p.n)+'" loading="lazy" onerror="this.parentNode.innerHTML=\'<span class=&quot;sinfoto&quot;>Sin foto</span>\'">'
      : '<span class="sinfoto">Sin foto</span>';
    var pend = p.fuente === 'pendiente' ? '<span class="pendiente">Ficha en preparación</span>' : '';
    var sello = (p.sellos && p.sellos.length) ? '<span class="sello-mini">Materiales certificados</span>' : '';
    var precio = p.iva
      ? '<div class="t-precio"><b>'+pesos(p.iva)+'</b><span>IVA incluido</span></div>'
      : '<div class="sinprecio">Precio a consultar</div>';
    return '<button class="tarjeta" data-i="'+i+'">' +
      '<div class="foto">'+foto+pend+sello+'</div>' +
      '<div class="t-cuerpo">' +
        '<p class="t-nombre">'+esc(p.n)+'</p>' +
        (p.oc ? '<div class="t-meta"><span class="t-oc">'+esc(p.oc)+'</span></div>' : '') +
        '<div class="t-pie">'+precio+'</div>' +
      '</div></button>';
  }
  function pintar(){
    var vis = P.map(function(p,i){ return {p:p, i:i}; }).filter(function(o){ return calza(o.p); });
    var cont = document.getElementById('lista');
    document.getElementById('conteo').textContent =
      vis.length + (vis.length === 1 ? ' producto' : ' productos');
    if(!vis.length){ cont.innerHTML = '<div class="vacio">No hay productos que coincidan con la búsqueda.</div>'; return; }
    var html = '';
    CATS.forEach(function(c){
      var dentro = vis.filter(function(o){ return o.p.cat === c.id; });
      if(!dentro.length) return;
      html += '<section class="seccion"><div class="seccion-cab"><h2>'+esc(c.n)+'</h2><p>'+esc(c.d)+'</p></div>' +
        '<div class="grilla">' + dentro.map(function(o){ return tarjeta(o.p, o.i); }).join('') + '</div></section>';
    });
    var huerfanos = vis.filter(function(o){ return !CATS.some(function(c){ return c.id === o.p.cat; }); });
    if(huerfanos.length){
      html += '<section class="seccion"><div class="seccion-cab"><h2>Otros</h2></div>' +
        '<div class="grilla">' + huerfanos.map(function(o){ return tarjeta(o.p, o.i); }).join('') + '</div></section>';
    }
    cont.innerHTML = html;
  }
  document.getElementById('lista').addEventListener('click', function(e){
    var t = e.target.closest('.tarjeta'); if(t) abrir(Number(t.dataset.i));
  });

  /* ── Ficha ───────────────────────────────────────────── */
  function bloque(titulo, cuerpo){ return cuerpo ? '<div class="bloque"><h4>'+titulo+'</h4>'+cuerpo+'</div>' : ''; }

  /* Los materiales: los sellos primero, que es lo que se lee de un vistazo, y debajo el
     detalle con el texto aprobado. */
  function bloqueMateriales(p){
    if(!p.mat) return '';
    var lineas = String(p.mat).split('\n').filter(Boolean).map(function(l){
      var i = l.indexOf(':');
      return i > 0
        ? '<div><b>'+esc(l.slice(0,i+1))+'</b> '+esc(l.slice(i+1).trim())+'</div>'
        : '<div>'+esc(l)+'</div>';
    }).join('');
    return '<div class="mat">' +
      '<div class="mat-cab">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 3 4 6v6c0 4.4 3.4 8.3 8 9 4.6-.7 8-4.6 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>' +
        '<b>Materiales · lo que el papel acredita</b>' +
      '</div>' +
      (p.sellos && p.sellos.length
        ? '<div class="mat-sellos">'+p.sellos.map(function(s){ return '<span>'+esc(s)+'</span>'; }).join('')+'</div>' : '') +
      '<div class="mat-detalle">'+lineas+'</div>' +
    '</div>';
  }
  function comoLista(txt){
    var p = String(txt).split('·').map(function(x){ return x.trim(); }).filter(Boolean);
    if(p.length < 2) return '<p>'+esc(txt)+'</p>';
    return '<div class="lista">' + p.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('') + '</div>';
  }
  window.abrir = function(i){
    var p = P[i];
    document.getElementById('fNombre').textContent = p.n;
    document.getElementById('fOc').textContent = '';
    var fotos = [].concat(p.img ? [p.img] : [], p.imgs || []).filter(function(v,ix,a){ return v && a.indexOf(v)===ix; });
    var galeria = fotos.length
      ? '<div class="f-fotos"><div class="f-foto"><img id="fGrande" src="'+esc(fotos[0])+'" alt="'+esc(p.n)+'"></div>' +
        (fotos.length > 1 ? '<div class="f-mini">' + fotos.map(function(f,k){
          return '<button aria-pressed="'+(k===0)+'" onclick="cambiarFoto(this,\''+esc(f)+'\')"><img src="'+esc(f)+'" alt=""></button>'; }).join('') + '</div>' : '') +
        '</div>'
      : '<div class="f-foto"><span class="sinfoto">Sin foto</span></div>';

    var precio = p.iva
      ? '<div class="f-precio"><div class="grande">'+pesos(p.iva)+'</div>' +
        '<div class="chico">IVA incluido'+(p.aprox ? ' · valor aproximado' : '')+
        (p.oc ? ' · '+esc(p.oc) : '')+'</div></div>'
      : '<div class="f-precio"><div class="grande" style="font-size:16px">Precio a consultar</div></div>';

    var tags = p.fuente === 'pendiente'
      ? '<div class="f-tags"><span class="tag aviso">Ficha en preparación</span></div>' : '';

    /* Rayen, 15-sep-2026: qué estimula va DENTRO del párrafo, no en chips aparte. */
    var destacados =
      (p.logro ? '<div class="destacado"><b>Qué logra</b>'+esc(p.logro)+'</div>' : '') +
      (p.unico ? '<div class="destacado"><b>Lo que lo hace distinto</b>'+esc(p.unico)+'</div>' : '');

    document.getElementById('fCuerpo').innerHTML =
      '<div class="f-alto">'+galeria+'<div class="f-datos">'+precio+tags+destacados+'</div></div>' +
      bloque('Qué es y para qué sirve', p.que
        ? '<p>'+esc(p.que)+(p.frase ? ' <span class="estim">'+esc(p.frase)+'</span>' : '')+'</p>' : '') +
      bloque('Qué se trabaja con él', p.trab ? comoLista(p.trab) : '') +
      bloque('Indicado para', p.ind ? comoLista(p.ind) : '') +
      bloque('Qué incluye la entrega', p.inc ? '<p>'+esc(p.inc)+'</p>' : '') +
      bloque('Ficha técnica', p.tec ? '<div class="tecnica">'+esc(p.tec)+'</div>' : '') +
      bloque('Características', p.car ? comoLista(p.car) : '') +
      bloqueMateriales(p) +
      (p.fuente === 'pendiente'
        ? '<p class="nota">La descripción de este producto todavía se está preparando.</p>' : '');

    document.getElementById('velo').classList.add('abierto');
    document.body.style.overflow = 'hidden';
  };
  window.cambiarFoto = function(btn, src){
    document.getElementById('fGrande').src = src;
    [].forEach.call(btn.parentNode.children, function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  };
  window.cerrar = function(){
    document.getElementById('velo').classList.remove('abierto');
    document.body.style.overflow = '';
  };
  document.getElementById('velo').addEventListener('click', function(e){ if(e.target === this) cerrar(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') cerrar(); });

  /* ── Arranque ────────────────────────────────────────── */
  document.getElementById('nProd').textContent = P.length;
  pintar();

  /* ?ver=<código OC o número> abre directamente esa ficha */
  var pedido = new URLSearchParams(location.search).get('ver');
  if(pedido){
    var k = P.findIndex(function(p){ return p.oc === pedido; });
    if(k < 0 && /^\d+$/.test(pedido)) k = Number(pedido);
    if(k >= 0 && k < P.length) abrir(k);
  }
})();
</script>
</body>
</html>
